<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Project</title>
<style>
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f9f9f7;
  --border: #e3e2dc;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a8983;
  --accent: #2a78d6;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #d63a2a;
  --pending: #b3b2ab;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.18);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --plan-order: var(--ink);
}
:root:not([data-theme="light"]) { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --border: #2f2f2d;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #85847c; --accent: #3987e5;
    --pending: #56554f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --border: #2f2f2d;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #85847c; --accent: #3987e5;
  --pending: #56554f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }

header {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .meta { color: var(--ink-3); font-size: 12px; }
.tiles { display: flex; gap: 8px; margin-left: auto; }
.tile {
  display: flex; flex-direction: column; padding: 6px 12px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); min-width: 84px;
}
.tile b { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.tabs button { padding: 4px 12px; border-radius: 6px; color: var(--ink-2); }
.tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.icon-btn { padding: 6px; border-radius: 8px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }

main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); overflow: auto; padding: 12px; background: var(--surface); }
aside h2, .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 8px 8px 6px; font-weight: 600; }
.epic {
  display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px;
}
.epic:hover { background: var(--surface-2); }
.epic.active { background: var(--surface-2); outline: 1px solid var(--border); }
.epic .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.epic .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; display: flex; overflow: hidden; gap: 1px; }
.bar i { display: block; height: 100%; }
.bar .done { background: var(--good); }
.bar .active { background: var(--accent); }

.content { overflow: auto; overflow-x: hidden; min-height: 0; position: relative; }
.board { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); align-content: start; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.card.pending { opacity: .85; }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; cursor: pointer; }
.card-head h3:hover { color: var(--accent); }
.brief { color: var(--ink-2); font-size: 13px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; color: var(--ink-2);
}
.chip svg { width: 10px; height: 10px; }
.chip.complete { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.in-progress { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); text-decoration: none; }
.chip.pending { color: var(--ink-3); border-color: var(--border); }
.chip.discarded { color: var(--ink-3); border-color: var(--border); text-decoration: line-through; }
.chip.pass { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip.empty { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.kind { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.link { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }
.card-head .link { align-self: center; }
.subtasks { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; }
.subtasks li {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
}
.subtasks li:hover { background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pending); flex: none; }
.dot.complete { background: var(--good); }
.dot.in-progress { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.discarded { background: transparent; border: 1px solid var(--ink-3); }
.subtasks li .t { flex: 1; }
.subtasks li.discarded .t { text-decoration: line-through; color: var(--ink-3); }
.subtasks li time { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.tests { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; align-items: center; }
.tests b.ok { color: var(--good); } .tests b.bad { color: var(--bad); } .tests b.empty { color: var(--warn); }
.deps { font-size: 12px; color: var(--ink-3); }
.deps code { font-family: var(--mono); font-size: 11px; }
.empty-state { color: var(--ink-3); padding: 60px; text-align: center; }

.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 90%); background: var(--surface);
  border-left: 1px solid var(--border); box-shadow: var(--shadow); overflow: auto; padding: 20px 24px;
  transform: translateX(101%); transition: transform .18s ease; z-index: 5;
}
.panel.open { transform: none; }
.panel .close { position: absolute; top: 12px; right: 12px; }
.panel .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.panel h1 { font-size: 20px; margin: 4px 0 8px; }
.panel .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.md { font-size: 14px; }
.md h1 { display: none; }
.md h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 18px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul { padding-left: 20px; margin: 0 0 10px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
.deliverables { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.deliverables li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.deliverables li .n { flex: 1; font-family: var(--mono); font-size: 12px; }
.deliverables img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; }
.readme-deliverable { margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }

.timeline { display: grid; grid-template-columns: 300px 1fr; height: 100%; min-height: 0; }
.tl-labels { overflow: hidden; border-right: 1px solid var(--border); background: var(--surface); }
.tl-scroll { overflow: auto; position: relative; }
.tl-row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 13px; }
.tl-row.epic-row { background: var(--surface-2); font-weight: 600; }
.tl-row.task-row { padding-left: 24px; }
.tl-row.sub-row { padding-left: 44px; color: var(--ink-2); font-size: 12px; }
.tl-row .lbl { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.tl-row .lbl:hover { color: var(--accent); }
.tl-head { position: sticky; top: 0; height: 40px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 2; }
.tl-head .day { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--border); padding: 4px 6px; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tl-head .day small { display: block; color: var(--ink-3); }
.tl-body { position: relative; }
.tl-grid-row { height: 30px; border-bottom: 1px solid var(--border); position: relative; }
.tl-grid-row.epic-row { background: var(--surface-2); }
.tl-bar { position: absolute; top: 8px; height: 14px; border-radius: 4px; background: var(--pending); min-width: 3px; cursor: pointer; }
.tl-bar.complete { background: var(--good); }
.tl-bar.in-progress { background: var(--accent); }
.tl-bar.in-progress::after {
  content: ""; position: absolute; right: -1px; top: 0; bottom: 0; width: 14px; border-radius: 0 4px 4px 0;
  background: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.45) 3px 6px);
}
.tl-bar.discarded { background: transparent; border: 1px dashed var(--ink-3); }
.tl-bar.epic-bar { top: 11px; height: 8px; opacity: .6; }
.tl-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--bad); z-index: 1; pointer-events: none; }
.tl-vline { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); pointer-events: none; }
.tl-tools { position: absolute; right: 16px; top: 8px; z-index: 3; display: flex; gap: 4px; }
.tl-tools button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.page { padding: 20px; display: grid; gap: 16px; align-content: start; }
.page .card { gap: 12px; overflow-x: auto; }
.page h2 { margin: 0; }
.card-title { display: flex; align-items: baseline; gap: 10px; }
.card-title h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-title span { color: var(--ink-3); font-size: 12px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.mono { font-family: var(--mono); font-size: 12px; }
table.data tbody tr.pick { cursor: pointer; }
table.data tbody tr.pick:hover { background: var(--surface-2); }
table.data tbody tr.sel { background: var(--surface-2); box-shadow: inset 2px 0 0 var(--accent); }
td .ok { color: var(--good); } td .bad { color: var(--bad); } td .empty { color: var(--warn); }
.muted { color: var(--ink-3); }
.chart { display: flex; flex-direction: column; gap: 6px; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 10px; }
.chart .ax-title { fill: var(--ink-3); font-size: 10px; letter-spacing: .04em; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.spark { display: block; }
.spark-cell { width: 92px; }
.tw { display: inline-block; width: 14px; color: var(--ink-2); font-size: 11px; }
td .dot { display: inline-block; vertical-align: middle; margin-right: 4px; }
tr.exp > td { background: var(--surface-2); padding: 8px 12px 12px; box-shadow: inset 2px 0 0 var(--accent); }
table.data.sub { margin: 2px 0 8px; }
table.data.sub th, table.data.sub td { padding: 4px 8px; font-size: 12px; }
.sub-note { color: var(--ink-3); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend span, .legend button { display: inline-flex; align-items: center; gap: 6px; }
.legend button { padding: 1px 5px; border-radius: 5px; color: var(--ink-2); }
.legend button:hover { background: var(--surface-2); color: var(--ink); }
.legend button.off { opacity: .45; text-decoration: line-through; }
.plan { position: relative; height: 100%; min-height: 0; overflow: hidden; }
#plan-svg { display: block; width: 100%; height: 100%; background: var(--surface); cursor: grab; }
#plan-svg.panning { cursor: grabbing; }
#plan-svg text { user-select: none; }
.plan-tools { position: absolute; right: 16px; top: 12px; z-index: 3; display: flex; gap: 6px; align-items: center; }
.plan-tools button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 9px; font-size: 12px; }
.plan-tools .hint { color: var(--ink-3); font-size: 11px; }
.plan-note { font-size: 12px; font-weight: 600; color: var(--good); }
.plan-note.bad { color: var(--bad); }
.plan-node rect.box { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.5; }
.plan-node .bar { fill: var(--pending); }
.plan-node .title { fill: var(--ink); font-size: 12px; font-weight: 650; }
.plan-node .sub { fill: var(--ink-3); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
.plan-node .plan-lock { fill: var(--ink-3); }
.plan-node.complete .bar, .plan-node.complete .plan-lock, .plan-node.complete .sub { fill: var(--good); }
.plan-node.complete rect.box { stroke: color-mix(in srgb, var(--good) 45%, var(--border)); }
.plan-node.in-progress .bar, .plan-node.in-progress .plan-lock, .plan-node.in-progress .sub { fill: var(--accent); }
.plan-node.in-progress rect.box { stroke: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.plan-node.discarded .bar { fill: transparent; }
.plan-node.locked rect.box { fill: color-mix(in srgb, var(--surface-2) 92%, var(--ink)); }
.plan-node.violation .sub { fill: var(--bad); }
.plan-node:hover rect.box { stroke: var(--accent); }
.plan-node.drop rect.box { stroke: var(--accent); stroke-width: 2.5; }
.plan-node.drop-bad rect.box { stroke: var(--bad); stroke-width: 2.5; }
.plan-dep { fill: none; stroke: var(--ink-3); stroke-width: 1.3; opacity: .38; }
.plan-order { fill: none; stroke: var(--plan-order); stroke-width: 2.4; stroke-linecap: round; }
.plan-arrow.bad .plan-order { stroke: var(--bad); }
.plan-arrow.dragging .plan-order { opacity: .25; }
.plan-hit { fill: none; stroke: transparent; stroke-width: 14; }
.plan-arrow.locked .plan-hit { cursor: not-allowed; }
.plan-handle { fill: var(--plan-order); stroke: var(--surface); stroke-width: 2; cursor: grab; }
.plan-handle.bad { fill: var(--bad); }
.plan-handle:hover { stroke: var(--accent); }
.plan-ghost { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: 7 5; pointer-events: none; }
.tooltip {
  position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px;
  font-size: 12px; z-index: 20; display: none; white-space: nowrap; box-shadow: var(--shadow);
}
.tooltip b { display: block; }
@media (max-width: 800px) {
  header { flex-wrap: wrap; row-gap: 8px; }
  header .meta { display: none; }
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 200px; }
  .tiles { display: none; }
  .timeline { grid-template-columns: 160px 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Box</h1>
  <span class="meta" id="generated"></span>
  <div class="tabs">
    <button data-view="board" class="active">Board</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="plan">Plan</button>
    <button data-view="tests">Tests</button>
    <button data-view="benchmarks">Benchmarks</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <a class="link" href="/inspector?http=http://localhost:27750" target="_blank" rel="noopener"
     title="Open the inspector connected to a local instance">Inspect local instance</a>
  <button class="icon-btn" id="theme" title="Toggle theme">◐</button>
</header>
<main>
  <aside>
    <h2>Epics</h2>
    <div id="epics"></div>
  </aside>
  <div class="content" id="content">
    <div id="board" class="board"></div>
    <div id="timeline" class="timeline" hidden></div>
    <div id="plan" class="plan" hidden></div>
    <div id="tests" class="page" hidden></div>
    <div id="benchmarks" class="page" hidden></div>
    <div class="panel" id="panel" hidden></div>
  </div>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
const state = {
  data: null, tests: null, bench: null, plan: null, epic: null, view: "board", zoom: 6, item: null, scene: null,
  suites: [], benchSuites: [], hidden: {}, planView: null,
  scroll: { content: 0, aside: 0, panel: 0, tlx: 0, tly: 0, tests: 0, bench: 0, plan: 0 },
};
const VIEWS = ["board", "timeline", "plan", "tests", "benchmarks"];
const CONTENT_KEY = { board: "content", tests: "tests", benchmarks: "bench", plan: "plan" };
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
const UI_KEY = "box-ui:" + location.pathname;
let saveTimer = 0, panelTimer = 0, restoring = false;
const ICONS = {
  complete: '<svg viewBox="0 0 10 10"><path d="M1.5 5.5l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  "in progress": '<svg viewBox="0 0 10 10"><path d="M2 1.5v7l6-3.5z" fill="currentColor"/></svg>',
  pending: '<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  discarded: '<svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
const cls = s => s.replace(" ", "-");
const inspectLink = item => item.inspect_url
  ? `<a class="link" href="${esc(item.inspect_url)}" target="_blank" rel="noopener"
       title="Open the inspector with the wasm image of this epic">Inspect</a>` : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const dur = (a, b) => {
  if (!a) return "";
  const ms = (b ? new Date(b) : new Date()) - new Date(a);
  const h = ms / 36e5;
  if (h < 1) return Math.round(ms / 6e4) + "m";
  if (h < 48) return h.toFixed(1) + "h";
  return (h / 24).toFixed(1) + "d";
};

function saveUi() {
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({
      view: state.view, epic: state.epic, item: state.item, zoom: state.zoom, scroll: state.scroll,
      suites: state.suites, benchSuites: state.benchSuites, hidden: state.hidden, scene: state.scene,
      planView: state.planView,
    }));
  } catch (e) {}
}

function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveUi, 200);
}

function loadUi() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(UI_KEY) || "null"); } catch (e) {}
  if (!saved) return;
  if (VIEWS.includes(saved.view)) state.view = saved.view;
  if (saved.epic) state.epic = saved.epic;
  if (saved.item) state.item = saved.item;
  if (Array.isArray(saved.suites)) state.suites = saved.suites;
  else if (saved.suite) state.suites = [saved.suite];
  if (Array.isArray(saved.benchSuites)) state.benchSuites = saved.benchSuites;
  if (saved.hidden && typeof saved.hidden === "object") state.hidden = saved.hidden;
  if (saved.scene) state.scene = saved.scene;
  if (saved.zoom > 0) state.zoom = saved.zoom;
  if (saved.planView && saved.planView.k > 0) state.planView = saved.planView;
  if (saved.scroll) Object.assign(state.scroll, saved.scroll);
}

function applyView() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
  for (const view of VIEWS) document.getElementById(view).hidden = state.view !== view;
}

function trackScroll(el, key) {
  el.onscroll = () => {
    if (restoring) return;
    state.scroll[typeof key === "function" ? key() : key] = el.scrollTop;
    saveSoon();
  };
}

function restoreScroll(el, top, left) {
  restoring = true;
  el.scrollTop = top;
  if (left != null) el.scrollLeft = left;
  requestAnimationFrame(() => { restoring = false; });
}

function chip(status) {
  return `<span class="chip ${cls(status)}">${ICONS[status] || ""}${esc(status)}</span>`;
}

const CASE_ICON = { pass: "complete", fail: "discarded", empty: "pending" };

function caseChip(status) {
  return `<span class="chip ${esc(status)}">${ICONS[CASE_ICON[status]] || ""}${esc(status)}</span>`;
}

function markdown(src) {
  const lines = src.split("\n");
  let html = "", inList = false, inCode = false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  for (const line of lines) {
    if (line.startsWith("```")) { inCode = !inCode; html += inCode ? "<pre>" : "</pre>"; continue; }
    if (inCode) { html += esc(line) + "\n"; continue; }
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^(#+) (.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function flatten(items, out = []) {
  for (const it of items) { out.push(it); flatten(it.children, out); }
  return out;
}

function counts(items) {
  const c = { complete: 0, "in progress": 0, pending: 0, discarded: 0, total: 0 };
  for (const it of items) { c[it.status] = (c[it.status] || 0) + 1; c.total++; }
  return c;
}

function findItem(path) {
  return flatten(state.data.epics).find(i => i.path === path);
}

function testSummary(item) {
  const t = item.deliverables.map(d => d.tests).filter(Boolean);
  if (!t.length) return "";
  const last = t[t.length - 1];
  return `<div class="tests" title="${esc(last.project)} · ${esc(last.timestamp)}">
    <span>${last.count} tests</span>
    <b class="ok">${last.pass} pass</b>
    ${last.fail ? `<b class="bad">${last.fail} fail</b>` : ""}
    ${last.empty ? `<b class="empty">${last.empty} empty</b>` : ""}
    <span>${(+last.elapsed).toFixed(1)}s</span></div>`;
}

function renderHeader() {
  const all = flatten(state.data.epics);
  const tasks = all.filter(i => i.level === "task");
  const subs = all.filter(i => i.level === "subtask");
  const ct = counts(tasks), cs = counts(subs);
  document.getElementById("tiles").innerHTML = `
    <div class="tile"><b>${state.data.epics.length}</b><span>epics</span></div>
    <div class="tile"><b>${ct.complete}<small style="color:var(--ink-3)">/${ct.total}</small></b><span>tasks done</span></div>
    <div class="tile"><b>${cs.complete}<small style="color:var(--ink-3)">/${cs.total}</small></b><span>subtasks done</span></div>
    <div class="tile"><b>${ct["in progress"] + cs["in progress"]}</b><span>active</span></div>`;
  document.getElementById("generated").textContent = "updated " + new Date(state.data.generated).toLocaleTimeString();
}

function renderEpics() {
  const el = document.getElementById("epics");
  el.innerHTML = state.data.epics.map(e => {
    const c = counts(flatten(e.children).filter(i => i.level === "task"));
    const pct = n => c.total ? (100 * n / c.total) + "%" : "0%";
    return `<button class="epic ${e.path === state.epic ? "active" : ""}" data-epic="${esc(e.path)}">
      <div class="name"><span class="dot ${cls(e.status)}"></span>${esc(e.readme.title || e.name)}</div>
      <div class="sub">${c.complete}/${c.total} tasks · ${esc(e.status)}</div>
      <div class="bar"><i class="done" style="width:${pct(c.complete)}"></i><i class="active" style="width:${pct(c["in progress"])}"></i></div>
    </button>`;
  }).join("") || `<div class="empty-state">No epics yet</div>`;
  el.querySelectorAll(".epic").forEach(b => b.onclick = () => { state.epic = b.dataset.epic; render(); });
  restoreScroll(document.querySelector("aside"), state.scroll.aside);
}

function renderBoard() {
  const board = document.getElementById("board");
  const epic = state.data.epics.find(e => e.path === state.epic);
  if (!epic) { board.innerHTML = `<div class="empty-state">Select an epic</div>`; return; }
  const cards = epic.children.map(t => `
    <div class="card ${cls(t.status)}">
      <div class="card-head">
        <h3 data-item="${esc(t.path)}">${esc(t.readme.title || t.name)}</h3>
        ${chip(t.status)}
      </div>
      <div class="kind">${esc(t.kind)} · ${esc(t.name)}${t.start_time ? " · " + dur(t.start_time, t.end_time) : ""}</div>
      <div class="brief">${esc(t.readme.brief || "")}</div>
      ${t.dependencies.length ? `<div class="deps">after ${t.dependencies.map(d => `<code>${esc(d)}</code>`).join(", ")}</div>` : ""}
      ${testSummary(t)}
      ${t.children.length ? `<ul class="subtasks">${t.children.map(s => `
        <li class="${cls(s.status)}" data-item="${esc(s.path)}">
          <span class="dot ${cls(s.status)}"></span><span class="t">${esc(s.readme.title || s.name)}</span>
          <time>${s.start_time ? dur(s.start_time, s.end_time) : ""}</time>
        </li>`).join("")}</ul>` : ""}
    </div>`);
  const epicCard = `
    <div class="card" style="grid-column: 1 / -1">
      <div class="card-head"><h3 data-item="${esc(epic.path)}">${esc(epic.readme.title || epic.name)}</h3>${inspectLink(epic)}${chip(epic.status)}</div>
      <div class="brief">${esc(epic.readme.brief || "")}</div>
      ${testSummary(epic)}
    </div>`;
  board.innerHTML = epicCard + (cards.join("") || `<div class="empty-state">No tasks yet</div>`);
  board.querySelectorAll("[data-item]").forEach(el => el.onclick = () => openPanel(el.dataset.item));
  restoreScroll(document.getElementById("content"), state.scroll.content);
}

function closePanel() {
  const panel = document.getElementById("panel");
  panel.classList.remove("open");
  clearTimeout(panelTimer);
  panelTimer = setTimeout(() => { if (!panel.classList.contains("open")) panel.hidden = true; }, 220);
}

function openPanel(path) {
  if (path !== state.item) state.scroll.panel = 0;
  state.item = path;
  const item = findItem(path);
  const panel = document.getElementById("panel");
  if (!item) { closePanel(); return; }
  const deliverables = item.deliverables.map(d => {
    const img = /\.(png|jpe?g|gif|webp|svg)$/i.test(d.name);
    const t = d.tests;
    if (/\.html$/i.test(d.name)) {
      return `<li><span class="n">${esc(d.name)}</span><a class="chip in-progress" href="${esc(d.url)}" target="_blank">${ICONS["in progress"]}open build</a></li>`;
    }
    return `<li><span class="n"><a href="${esc(d.url)}" target="_blank">${esc(d.name)}</a></span>
      ${t ? `<span class="tests"><b class="ok">${t.pass}</b>${t.fail ? `<b class="bad">${t.fail}</b>` : ""}${t.empty ? `<b class="empty">${t.empty}</b>` : ""}</span>` : `<span style="color:var(--ink-3);font-size:11px">${(d.size / 1024).toFixed(1)} KB</span>`}
      </li>${img ? `<li style="display:block;border:0;padding:0"><img src="${esc(d.url)}" alt="${esc(d.name)}"></li>` : ""}`;
  }).join("");
  panel.innerHTML = `
    <button class="close icon-btn" id="close">✕</button>
    <div class="path">${esc(item.level)} · ${esc(item.path)}</div>
    <h1>${esc(item.readme.title || item.name)}</h1>
    <div class="meta">${chip(item.status)}<span class="kind">${esc(item.kind)}</span>
      <span style="color:var(--ink-3);font-size:12px">${item.start_time ? fmtDate(item.start_time) + " → " + (item.end_time ? fmtDate(item.end_time) : "now") + " (" + dur(item.start_time, item.end_time) + ")" : "not started"}</span>
      ${inspectLink(item)}</div>
    ${item.dependencies.length ? `<div class="deps">Depends on ${item.dependencies.map(d => `<code>${esc(d)}</code>`).join(", ")}</div>` : ""}
    <div class="md">${markdown(item.readme.markdown)}</div>
    ${deliverables ? `<h2>Deliverables</h2><ul class="deliverables">${deliverables}</ul>` : ""}
    ${item.children.length ? `<h2>${item.children[0].level}s</h2><ul class="subtasks">${item.children.map(s => `
      <li class="${cls(s.status)}" data-item="${esc(s.path)}"><span class="dot ${cls(s.status)}"></span><span class="t">${esc(s.readme.title || s.name)}</span><time>${s.start_time ? dur(s.start_time, s.end_time) : ""}</time></li>`).join("")}</ul>` : ""}`;
  clearTimeout(panelTimer);
  if (panel.hidden) { panel.hidden = false; void panel.offsetWidth; }
  panel.classList.add("open");
  restoreScroll(panel, state.scroll.panel);
  saveSoon();
  document.getElementById("close").onclick = () => { state.item = null; state.scroll.panel = 0; closePanel(); saveUi(); };
  panel.querySelectorAll("[data-item]").forEach(el => el.onclick = () => openPanel(el.dataset.item));
  const readme = item.deliverables.find(d => /readme\.md$/i.test(d.name));
  if (readme) fetch(readme.url).then(r => r.text()).then(t => {
    const div = document.createElement("div");
    div.className = "readme-deliverable md";
    div.innerHTML = `<h2>Completion report</h2>` + markdown(t);
    panel.querySelector(".deliverables")?.after(div);
  });
}

function renderTimeline() {
  const tl = document.getElementById("timeline");
  const rows = [];
  for (const e of state.data.epics) {
    rows.push({ item: e, kind: "epic-row" });
    for (const t of e.children) {
      rows.push({ item: t, kind: "task-row" });
      for (const s of t.children) rows.push({ item: s, kind: "sub-row" });
    }
  }
  const now = Date.now();
  const times = flatten(state.data.epics).flatMap(i => [i.start_time, i.end_time]).filter(Boolean).map(t => +new Date(t));
  const t0 = new Date(Math.min(now, ...times)); t0.setHours(0, 0, 0, 0);
  const t1 = new Date(Math.max(now, ...times) + 36e5 * 12);
  const pxPerHour = state.zoom;
  const x = t => (t - t0) / 36e5 * pxPerHour;
  const width = Math.max(x(t1), 800);
  const days = [];
  for (let d = new Date(t0); d < t1; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  const bar = it => {
    if (!it.start_time) return "";
    const s = +new Date(it.start_time), e = it.end_time ? +new Date(it.end_time) : now;
    return `<div class="tl-bar ${cls(it.status)} ${it.level === "epic" ? "epic-bar" : ""}" data-item="${esc(it.path)}" style="left:${x(s)}px;width:${Math.max(3, x(e) - x(s))}px"></div>`;
  };
  tl.innerHTML = `
    <div class="tl-labels"><div style="height:40px;border-bottom:1px solid var(--border)"></div><div id="tl-label-rows">
      ${rows.map(r => `<div class="tl-row ${r.kind}"><span class="dot ${cls(r.item.status)}"></span><span class="lbl" data-item="${esc(r.item.path)}">${esc(r.item.readme.title || r.item.name)}</span></div>`).join("")}
    </div></div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl-tools"><button id="zoom-out">−</button><button id="zoom-in">+</button><button id="zoom-now">now</button></div>
      <div class="tl-head" style="width:${width}px">${days.map(d => `<div class="day" style="left:${x(d)}px">${d.toLocaleDateString([], { weekday: "short" })}<small>${d.toLocaleDateString([], { month: "short", day: "numeric" })}</small></div>`).join("")}</div>
      <div class="tl-body" style="width:${width}px">
        ${days.map(d => `<div class="tl-vline" style="left:${x(d)}px"></div>`).join("")}
        <div class="tl-now" style="left:${x(now)}px"></div>
        ${rows.map(r => `<div class="tl-grid-row ${r.kind}">${bar(r.item)}</div>`).join("")}
      </div>
    </div>`;
  const scroll = document.getElementById("tl-scroll");
  const labels = document.getElementById("tl-label-rows");
  scroll.onscroll = () => {
    labels.style.transform = `translateY(${-scroll.scrollTop}px)`;
    if (restoring) return;
    state.scroll.tlx = scroll.scrollLeft;
    state.scroll.tly = scroll.scrollTop;
    saveSoon();
  };
  const rezoom = z => {
    state.scroll.tlx *= z / state.zoom;
    state.zoom = z;
    renderTimeline();
    saveUi();
  };
  document.getElementById("zoom-in").onclick = () => rezoom(Math.min(120, state.zoom * 1.5));
  document.getElementById("zoom-out").onclick = () => rezoom(Math.max(1, state.zoom / 1.5));
  document.getElementById("zoom-now").onclick = () => { scroll.scrollLeft = x(now) - scroll.clientWidth * .7; };
  if (state.scroll.tlx || state.scroll.tly) restoreScroll(scroll, state.scroll.tly, state.scroll.tlx);
  else scroll.scrollLeft = Math.max(0, x(now) - scroll.clientWidth * .7);
  labels.style.transform = `translateY(${-scroll.scrollTop}px)`;
  const tip = document.getElementById("tooltip");
  tl.querySelectorAll("[data-item]").forEach(el => {
    el.onclick = () => openPanel(el.dataset.item);
    if (!el.classList.contains("tl-bar")) return;
    el.onmousemove = ev => {
      const it = findItem(el.dataset.item);
      tip.style.display = "block"; tip.style.left = ev.clientX + 12 + "px"; tip.style.top = ev.clientY + 12 + "px";
      tip.innerHTML = `<b>${esc(it.readme.title || it.name)}</b>${esc(it.status)} · ${fmtDate(it.start_time)} → ${it.end_time ? fmtDate(it.end_time) : "now"} · ${dur(it.start_time, it.end_time)}`;
    };
    el.onmouseleave = () => tip.style.display = "none";
  });
}

function niceTicks(max, count) {
  if (!(max > 0)) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm > 5 ? 10 : norm > 2 ? 5 : norm > 1 ? 2 : 1) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let i = 0; i * step <= top + step * 1e-9; i++) ticks.push(+(i * step).toPrecision(12));
  return ticks;
}

function chartWidth(el) {
  return Math.max(320, (el.clientWidth || 900) - 74);
}

function seriesDash(i) {
  return i >= SERIES.length * 2 ? "2 3" : i >= SERIES.length ? "6 4" : null;
}

function nsUnit(max) {
  if (max >= 1e9) return { div: 1e9, unit: "s" };
  if (max >= 1e6) return { div: 1e6, unit: "ms" };
  if (max >= 1e3) return { div: 1e3, unit: "µs" };
  return { div: 1, unit: "ns" };
}

function nsText(v) {
  if (v == null) return "—";
  const u = nsUnit(Math.abs(v));
  return +(v / u.div).toPrecision(4) + " " + u.unit;
}

function lineChart(spec) {
  const all = (spec.series || []).filter(s => s.points.length);
  if (!all.length) return `<div class="chart"><div class="empty-state">No data points</div></div>`;
  const shown = all.filter(s => !s.hidden);
  const scale = shown.length ? shown : all;
  const w = spec.width, h = spec.height || 210;
  const pad = { l: 56, r: 18, t: 22, b: 40 };
  const iw = Math.max(120, w - pad.l - pad.r), ih = Math.max(70, h - pad.t - pad.b);
  const ts = scale.flatMap(s => s.points.map(p => p.t));
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 - t0 < 6e5) { t0 -= 9e5; t1 += 9e5; }
  const values = scale.flatMap(s => s.points.map(p => p.v).concat((s.band || []).map(b => b.hi)));
  const ticks = niceTicks(Math.max(...values, 0), 4);
  const top = ticks[ticks.length - 1] || 1;
  const X = t => +(pad.l + (t - t0) / (t1 - t0) * iw).toFixed(1);
  const Y = v => +(pad.t + ih - Math.max(0, Math.min(v, top)) / top * ih).toFixed(1);
  const fmt = spec.yFormat || (v => String(+v.toPrecision(3)));
  const grid = ticks.map(v => `<line class="grid" x1="${pad.l}" y1="${Y(v)}" x2="${pad.l + iw}" y2="${Y(v)}"/>
    <text class="ax" x="${pad.l - 8}" y="${Y(v) + 3.5}" text-anchor="end">${esc(fmt(v))}</text>`).join("");
  let lastDay = "";
  const xAxis = [0, 1, 2, 3, 4].map(i => {
    const t = t0 + (t1 - t0) * i / 4, d = new Date(t);
    const day = d.toLocaleDateString([], { month: "short", day: "numeric" });
    const show = day !== lastDay;
    const anchor = i === 0 ? "start" : i === 4 ? "end" : "middle";
    lastDay = day;
    return `<text class="ax" x="${X(t)}" y="${pad.t + ih + 15}" text-anchor="${anchor}">${esc(d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}${show ? `<tspan x="${X(t)}" dy="12">${esc(day)}</tspan>` : ""}</text>`;
  }).join("");
  const bands = shown.map(s => {
    const band = s.band || [];
    if (!band.length) return "";
    if (band.length === 1) {
      return `<line x1="${X(band[0].t)}" y1="${Y(band[0].hi)}" x2="${X(band[0].t)}" y2="${Y(band[0].lo)}"
        stroke="${s.color}" stroke-width="8" stroke-linecap="round" opacity=".22"/>`;
    }
    const up = band.map(b => `${X(b.t)},${Y(b.hi)}`).join(" ");
    const down = band.slice().reverse().map(b => `${X(b.t)},${Y(b.lo)}`).join(" ");
    return `<polygon points="${up} ${down}" fill="${s.color}" opacity=".16"/>`;
  }).join("");
  const marks = shown.map(s => {
    const pts = s.points.map(p => `${X(p.t)},${Y(p.v)}`).join(" ");
    const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
    const line = s.points.length > 1
      ? `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${dash} points="${pts}"/>` : "";
    return line + s.points.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`).join("");
  }).join("");
  const hits = shown.flatMap(s => s.points.map(p =>
    `<circle class="hit" cx="${X(p.t)}" cy="${Y(p.v)}" r="9" data-tip="${esc(p.tip)}" data-sub="${esc(p.sub || "")}"/>`)).join("");
  const items = spec.legend || (all.length > 1 ? all : []);
  const legend = items.length ? `<div class="legend">${items.map(s => {
    const swatch = `<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="${s.color}" stroke-width="2"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/></svg>${esc(s.name)}`;
    return s.key
      ? `<button class="${s.hidden ? "off" : ""}" data-series="${esc(s.key)}" title="Show or hide this line">${swatch}</button>`
      : `<span>${swatch}</span>`;
  }).join("")}</div>` : "";
  return `<div class="chart">${legend}
    <svg width="${w}" height="${h}" role="img" aria-label="${esc(spec.label || "time series")}">
      ${grid}<line class="grid" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ih}"/>
      <text class="ax-title" x="${pad.l}" y="${pad.t - 10}">${esc(spec.yLabel || "")}</text>
      ${xAxis}${bands}${marks}${hits}
    </svg></div>`;
}

function sparkline(points, color, tip, sub) {
  if (!points.length) return `<span class="muted">—</span>`;
  const w = 84, h = 22, pad = 3;
  const ts = points.map(p => p.t), vs = points.map(p => p.v);
  const t0 = Math.min(...ts), t1 = Math.max(...ts), top = Math.max(...vs, 0) || 1;
  const X = t => +(t1 === t0 ? w / 2 : pad + (t - t0) / (t1 - t0) * (w - 2 * pad)).toFixed(1);
  const Y = v => +(h - pad - Math.max(0, v) / top * (h - 2 * pad)).toFixed(1);
  const last = points[points.length - 1];
  const line = points.length > 1
    ? `<polyline fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" points="${points.map(p => `${X(p.t)},${Y(p.v)}`).join(" ")}"/>` : "";
  return `<svg class="spark" width="${w}" height="${h}" data-tip="${esc(tip)}" data-sub="${esc(sub || "")}"
    role="img" aria-label="${esc(tip)}">${line}<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="2.5" fill="${color}"/></svg>`;
}

function bindTips(host) {
  const tip = document.getElementById("tooltip");
  host.querySelectorAll("[data-tip]").forEach(el => {
    el.onmousemove = ev => {
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 12, innerWidth - 260) + "px";
      tip.style.top = ev.clientY + 12 + "px";
      const b = document.createElement("b");
      b.textContent = el.dataset.tip;
      tip.replaceChildren(b, document.createTextNode(el.dataset.sub || ""));
    };
    el.onmouseleave = () => { tip.style.display = "none"; };
  });
}

function bindRows(host, attr, expanded, rerender) {
  host.querySelectorAll("[" + attr + "]").forEach(row => row.onclick = () => {
    const key = row.getAttribute(attr);
    const i = expanded.indexOf(key);
    if (i < 0) expanded.push(key); else expanded.splice(i, 1);
    rerender();
    saveUi();
  });
  host.querySelectorAll("[data-series]").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const key = btn.dataset.series;
    if (state.hidden[key]) delete state.hidden[key]; else state.hidden[key] = true;
    rerender();
    saveUi();
  });
}

function testSuiteRows(suites, hist, caseHist) {
  return suites.map((s, i) => {
    const color = SERIES[i % SERIES.length];
    const open = state.suites.includes(s.key);
    const history = hist[s.key] || [];
    const points = history.map(h => ({ t: +new Date(h.time), v: h.elapsed }));
    const row = `<tr class="pick${open ? " sel" : ""}" data-suite="${esc(s.key)}">
      <td><span class="tw">${open ? "▾" : "▸"}</span><span class="dot" style="background:${color}"></span> <b>${esc(s.suite)}</b></td>
      <td class="num">${s.cases}</td><td class="num ok">${s.pass}</td>
      <td class="num${s.fail ? " bad" : ""}">${s.fail}</td><td class="num${s.empty ? " empty" : ""}">${s.empty}</td>
      <td class="num">${(+s.time).toFixed(3)}</td>
      <td class="spark-cell">${sparkline(points, color, s.suite + " · " + history.length + " report(s)",
        points.map(p => (+p.v).toFixed(3) + "s").slice(-6).join(" → "))}</td>
      <td class="muted">${esc(s.item || "db")} · ${esc(fmtDate(s.report_time))}</td></tr>`;
    if (!open) return row;
    const cases = (s.cases_detail || []).map(c => {
      const ch = caseHist[s.key + "|" + c.case] || [];
      const color2 = c.status === "fail" ? "var(--bad)" : c.status === "empty" ? "var(--warn)" : "var(--good)";
      return `<tr><td class="mono">${esc(c.case)}</td><td>${caseChip(c.status)}</td>
        <td class="num">${(+c.time).toFixed(4)}</td>
        <td class="spark-cell">${sparkline(ch.map(h => ({ t: +new Date(h.time), v: h.elapsed })), color2,
          c.case + " · " + ch.length + " report(s)", ch.map(h => (+h.elapsed).toFixed(4) + "s").slice(-6).join(" → "))}</td></tr>`;
    }).join("");
    return row + `<tr class="exp"><td colspan="8">
      <table class="data sub"><thead><tr><th>Case</th><th>Status</th><th class="num">Time (s)</th><th>History</th></tr></thead>
        <tbody>${cases}</tbody></table>
      <div class="sub-note">latest report <a href="${esc(s.url)}" target="_blank">${esc(s.file)}</a></div></td></tr>`;
  }).join("");
}

function testProjectCard(project, suites, hist, caseHist, width) {
  const series = suites.map((s, i) => ({
    key: "tests:" + s.key, name: s.suite, color: SERIES[i % SERIES.length], dash: seriesDash(i),
    hidden: !!state.hidden["tests:" + s.key],
    points: (hist[s.key] || []).map(h => ({
      t: +new Date(h.time), v: h.elapsed,
      tip: `${s.suite} · ${(+h.elapsed).toFixed(3)}s`,
      sub: `${fmtDate(h.time)} · ${h.item || "db"} · ${h.cases} cases · ${h.pass} pass${h.fail ? ` · ${h.fail} fail` : ""}`,
    })),
  }));
  return `<div class="card">
    <div class="card-title"><h3>${esc(project.project)}</h3>
      <span>${project.suites} suites · ${project.cases} cases · <b class="ok">${project.pass} pass</b>${project.fail ? ` · <b class="bad">${project.fail} fail</b>` : ""}${project.empty ? ` · <b class="empty">${project.empty} empty</b>` : ""} · ${(+project.time).toFixed(3)}s · click a suite for its cases</span></div>
    <table class="data"><thead><tr><th>Suite</th><th class="num">Cases</th><th class="num">Pass</th><th class="num">Fail</th>
      <th class="num">Empty</th><th class="num">Time (s)</th><th>History</th><th>Report</th></tr></thead>
      <tbody>${testSuiteRows(suites, hist, caseHist)}</tbody></table>
    <div class="card-title"><h3>Time per suite</h3><span>seconds per report · click a legend entry to hide a line</span></div>

}

function renderTests() {
  const el = document.getElementById("tests");
  const d = state.tests;
  if (!d) { el.innerHTML = `<div class="empty-state">Loading test reports…</div>`; return; }
  if (d.stale) { el.innerHTML = `<div class="empty-state">This server predates this page. Restart it: <code>python3 project/pm.py serve</code></div>`; return; }
  if (!d.reports.length) { el.innerHTML = `<div class="empty-state">No test reports under project/db</div>`; return; }
  const w = chartWidth(el);
  const hist = d.suite_history || {}, caseHist = d.case_history || {};
  const reports = d.reports.filter(r => r.time);
  const byProject = {};
  for (const s of d.suites) (byProject[s.project] = byProject[s.project] || []).push(s);
  const totals = d.projects.reduce((a, p) => ({
    cases: a.cases + p.cases, pass: a.pass + p.pass, fail: a.fail + p.fail, empty: a.empty + p.empty, time: a.time + p.time,
  }), { cases: 0, pass: 0, fail: 0, empty: 0, time: 0 });
  const point = (r, v) => ({
    t: +new Date(r.time), v,
    tip: `${r.project} · ${r.item || "db"}`,
    sub: `${fmtDate(r.time)}${r.time_source === "mtime" ? " (file time)" : ""} · ${r.pass} pass · ${r.fail} fail · ${r.cases} cases · ${(+r.elapsed).toFixed(2)}s`,
  });
  const anyEmpty = reports.some(r => r.empty > 0);
  const counts = lineChart({
    width: w, label: "test cases per report over time", yLabel: "cases", yFormat: v => String(Math.round(v)),
    series: [
      { name: "pass", color: "var(--good)", points: reports.map(r => point(r, r.pass)) },
      { name: "fail", color: "var(--bad)", points: reports.map(r => point(r, r.fail)) },
      ...(anyEmpty ? [{ name: "empty", color: "var(--warn)", points: reports.map(r => point(r, r.empty)) }] : []),
    ],
  });
  const timing = lineChart({
    width: w, label: "total run time per report over time", yLabel: "seconds", yFormat: v => v.toFixed(2),
    series: [{ name: "run time", color: "var(--accent)", points: reports.map(r => point(r, r.elapsed)) }],
  });
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><h3>Latest test run</h3>
        <span>${d.reports.length} reports · ${d.suites.length} suites · ${totals.cases} cases ·
        <b class="ok">${totals.pass} pass</b>${totals.fail ? ` · <b class="bad">${totals.fail} fail</b>` : ""}${totals.empty ? ` · <b class="empty">${totals.empty} empty</b>` : ""} ·
        ${totals.time.toFixed(2)}s</span></div>
      <table class="data"><thead><tr><th>Project</th><th class="num">Suites</th><th class="num">Cases</th>
        <th class="num">Passed</th><th class="num">Failed</th><th class="num">Empty</th><th class="num">Time (s)</th></tr></thead>
        <tbody>${d.projects.map(p => `<tr><td><b>${esc(p.project)}</b></td><td class="num">${p.suites}</td><td class="num">${p.cases}</td>
          <td class="num ok">${p.pass}</td><td class="num${p.fail ? " bad" : ""}">${p.fail}</td>
          <td class="num${p.empty ? " empty" : ""}">${p.empty}</td><td class="num">${(+p.time).toFixed(3)}</td></tr>`).join("")}</tbody></table>
    </div>
    ${d.projects.map(p => testProjectCard(p, byProject[p.project] || [], hist, caseHist, w)).join("")}

      <div class="card-title"><h3>Pass and fail over time</h3>
        <span>one point per report · ${esc(fmtDate(reports.length ? reports[reports.length - 1].time : null))} latest</span></div>

}

function microCaseSeries(suite, caseHist, offset) {
  return (suite.cases_detail || []).map((c, j) => {
    const key = "bench:" + suite.key + "|" + c.case;
    const history = caseHist[suite.key + "|" + c.case] || [];
    return {
      key, name: suite.suite + "." + c.case, color: SERIES[(offset + j) % SERIES.length], dash: seriesDash(j),
      hidden: !!state.hidden[key],
      points: history.map(h => ({
        t: +new Date(h.time), v: h.median_ns,
        tip: `${c.case} · ${nsText(h.median_ns)}`,
        sub: `${fmtDate(h.time)} · ${h.item || ""}${h.ci_low_ns == null ? "" : ` · ci95 ${nsText(h.ci_low_ns)} – ${nsText(h.ci_high_ns)}`}`,
      })),
      band: history.filter(h => h.ci_low_ns != null && h.ci_high_ns != null)
        .map(h => ({ t: +new Date(h.time), lo: h.ci_low_ns, hi: h.ci_high_ns })),
    };
  });
}

function microSuiteRows(suites, hist, caseHist, width) {
  return suites.map((s, i) => {
    const color = SERIES[i % SERIES.length];
    const open = state.benchSuites.includes(s.key);
    const history = hist[s.key] || [];
    const points = history.map(h => ({ t: +new Date(h.time), v: h.median_ns }));
    const row = `<tr class="pick${open ? " sel" : ""}" data-bench-suite="${esc(s.key)}">
      <td><span class="tw">${open ? "▾" : "▸"}</span><span class="dot" style="background:${color}"></span> <b>${esc(s.suite)}</b></td>
      <td class="num">${s.cases}</td><td class="num">${esc(nsText(s.median_ns))}</td><td class="num">${esc(nsText(s.mean_ns))}</td>
      <td class="spark-cell">${sparkline(points, color, s.suite + " · " + history.length + " report(s)",
        points.map(p => nsText(p.v)).slice(-6).join(" → "))}</td>
      <td class="muted">${esc(s.item || "")} · ${esc(fmtDate(s.time))}</td></tr>`;
    if (!open) return row;
    const rows = (s.cases_detail || []).map((c, j) => {
      const ch = caseHist[s.key + "|" + c.case] || [];
      return `<tr><td class="mono">${esc(c.case)}</td>
        <td class="num">${esc(nsText(c.median_ns))}</td>
        <td class="num muted">${c.ci_low_ns == null ? "—" : esc(nsText(c.ci_low_ns) + " – " + nsText(c.ci_high_ns))}</td>
        <td class="num">${esc(nsText(c.mean_ns))}</td><td class="num">${esc(nsText(c.stddev_ns))}</td>
        <td class="num">${esc(nsText(c.p99_ns))}</td>
        <td class="num">${c.iterations == null ? "—" : (+c.iterations).toLocaleString()}</td>
        <td class="num">${c.samples == null ? "—" : c.samples}</td>
        <td class="num${c.outliers ? " empty" : ""}">${c.outliers == null ? "—" : c.outliers}</td>
        <td class="spark-cell">${sparkline(ch.map(h => ({ t: +new Date(h.time), v: h.median_ns })), SERIES[j % SERIES.length],
          c.case + " · " + ch.length + " report(s)", ch.map(h => nsText(h.median_ns)).slice(-6).join(" → "))}</td></tr>`;
    }).join("");
    const series = microCaseSeries(s, caseHist, i);

        <th class="num">Samples</th><th class="num">Outliers</th><th>History</th></tr></thead>
        <tbody>${rows}</tbody></table>
      ${lineChart({ width: Math.max(320, width - 60), height: 190, label: s.suite + " median over time",
        yLabel: "median (" + unit.unit + ")", yFormat: v => String(+(v / unit.div).toPrecision(3)), series })}
      <div class="sub-note">median with its 95% confidence interval as a band · latest report
        <a href="${esc(s.url)}" target="_blank">${esc(s.file)}</a></div></td></tr>`;
  }).join("");
}

function microProjectCard(project, suites, hist, caseHist, width) {
  const series = [];
  suites.forEach((s, i) => {
    if (state.benchSuites.includes(s.key)) {
      series.push(...microCaseSeries(s, caseHist, i).map(x => ({ ...x, key: "bench:sum:" + x.key, hidden: !!state.hidden["bench:sum:" + x.key], band: null })));
      return;
    }
    const key = "bench:sum:" + s.key;
    series.push({
      key, name: s.suite, color: SERIES[i % SERIES.length], dash: seriesDash(i), hidden: !!state.hidden[key],
      points: (hist[s.key] || []).map(h => ({
        t: +new Date(h.time), v: h.median_ns,
        tip: `${s.suite} · ${nsText(h.median_ns)}`,
        sub: `${fmtDate(h.time)} · ${h.item || ""} · ${h.cases} case(s)`,
      })),
    });
  });
  const unit = nsUnit(Math.max(...series.flatMap(x => x.points.map(p => p.v)), 0));
  return `<div class="card">
    <div class="card-title"><h3>${esc(project.project)}</h3>
      <span>${project.suites} suites · ${project.cases} cases · ${esc(nsText(project.median_ns))} total ·
      ${esc(fmtDate(project.time))} · click a suite for its cases</span></div>
    <table class="data"><thead><tr><th>Suite</th><th class="num">Cases</th><th class="num">Median total</th>
      <th class="num">Mean total</th><th>History</th><th>Report</th></tr></thead>

}

  const el = document.getElementById("benchmarks");
  const d = state.bench;
  if (!d) { el.innerHTML = `<div class="empty-state">Loading benchmark reports…</div>`; return; }

  const microProjects = d.micro_projects || [], microSuites = d.micro_suites || [];
  if (!d.scenes.length && !microSuites.length) { el.innerHTML = `<div class="empty-state">No benchmark reports under project/db or test/integration/out</div>`; return; }
  const w = chartWidth(el);
  const mHist = d.micro_suite_history || {}, mCases = d.micro_case_history || {};
  const byProject = {};
  for (const s of microSuites) (byProject[s.project] = byProject[s.project] || []).push(s);
  const color = {};
  d.scenes.forEach((s, i) => { color[s.scene] = SERIES[i % SERIES.length]; });

    t: +new Date(run.time), v: run[key],

  for (const scene of d.scenes.map(s => s.scene)) {

    series.push({ name: scene + " mean", color: color[scene], points: runs.map(r => metric(r, "mean_ms")).filter(Boolean) });

  const chart = d.scenes.length ? lineChart({
    width: w, label: "frame time per scene over time", yLabel: "frame time (ms)",
    yFormat: v => v.toFixed(2), series, legend,
  }) : "";
  const cell = (v, n) => `<td class="num">${v == null ? "—" : (+v).toFixed(n)}</td>`;
  const selected = d.scenes.find(s => s.scene === state.scene);
  const history = selected ? d.runs.filter(r => r.scene === selected.scene) : [];
  el.innerHTML = `
    ${!microSuites.length ? "" : `<div class="card">
      <div class="card-title"><h3>Microbenchmarks</h3>
        <span>${microProjects.length} bench projects · ${microSuites.length} suites ·
        ${microSuites.reduce((a, s) => a + s.cases, 0)} cases · ${(d.micro_runs || []).length} case runs · bake3 reports</span></div>
      <table class="data"><thead><tr><th>Project</th><th class="num">Suites</th><th class="num">Cases</th>
        <th class="num">Median total</th><th>Report</th></tr></thead>
        <tbody>${microProjects.map(p => `<tr><td><b>${esc(p.project)}</b></td><td class="num">${p.suites}</td>
          <td class="num">${p.cases}</td><td class="num">${esc(nsText(p.median_ns))}</td>
          <td class="muted">${esc(p.item || "")} · ${esc(fmtDate(p.time))}</td></tr>`).join("")}</tbody></table>
    </div>`}
    ${microProjects.map(p => microProjectCard(p, byProject[p.project] || [], mHist, mCases, w)).join("")}
    ${!d.scenes.length ? "" : `<div class="card">
      <div class="card-title"><h3>Scene benchmarks</h3>
        <span>${d.scenes.length} scenes · ${d.runs.length} runs · latest per scene · click a row for its history</span></div>
      <table class="data"><thead><tr><th>Scene</th><th class="num">Entities</th><th class="num">Frames</th>
        <th class="num">Mean (ms)</th><th class="num">p50 (ms)</th><th class="num">p99 (ms)</th><th class="num">Max (ms)</th>
        <th class="num">FPS</th><th>Report</th></tr></thead>
        <tbody>${d.scenes.map(s => `<tr class="pick ${s.scene === state.scene ? "sel" : ""}" data-scene="${esc(s.scene)}">
          <td><span class="tw">${s.scene === state.scene ? "▾" : "▸"}</span><span class="dot" style="background:${color[s.scene]}"></span> <b>${esc(s.scene)}</b></td>
          <td class="num">${s.entities == null ? "—" : (+s.entities).toLocaleString()}</td>
          <td class="num">${s.frames == null ? "—" : s.frames}</td>
          ${cell(s.mean_ms, 3)}${cell(s.p50_ms, 3)}${cell(s.p99_ms, 3)}${cell(s.max_ms, 3)}${cell(s.fps, 0)}
          <td class="muted">${esc(s.item || "")} · ${esc(fmtDate(s.time))}</td></tr>
          ${s.scene !== state.scene ? "" : `<tr class="exp"><td colspan="9">
            <table class="data sub"><thead><tr><th>When</th><th class="num">Mean (ms)</th><th class="num">p99 (ms)</th>
              <th class="num">Max (ms)</th><th class="num">FPS</th><th>File</th></tr></thead>
              <tbody>${history.slice().reverse().map(r => `<tr><td>${esc(fmtDate(r.time))}${r.time_source === "mtime" ? ' <span class="muted">(file time)</span>' : ""}</td>
                ${cell(r.mean_ms, 3)}${cell(r.p99_ms, 3)}${cell(r.max_ms, 3)}${cell(r.fps, 0)}
                <td class="mono">${r.url ? `<a href="${esc(r.url)}" target="_blank">${esc(r.file)}</a>` : esc(r.file)}</td></tr>`).join("")}</tbody></table>
            <div class="sub-note">${history.length} run(s)${selected && selected.source ? " · " + esc(selected.source) : ""}</div></td></tr>`}`).join("")}</tbody></table>
      <div class="card-title"><h3>Frame time over time</h3><span>one line per scene, solid mean and dashed p99</span></div>
      ${chart}
    </div>`}`;
  el.querySelectorAll("[data-scene]").forEach(row => row.onclick = () => {
    state.scene = state.scene === row.dataset.scene ? null : row.dataset.scene;
    renderBenchmarks();
    saveUi();
  });
  bindRows(el, "data-bench-suite", state.benchSuites, renderBenchmarks);
  bindTips(el);
  restoreScroll(document.getElementById("content"), state.scroll.bench);
}

// --- plan logic (extracted by test_pm.py, keep free of DOM access) ---
const PLAN_BOX = { w: 176, h: 48, colGap: 92, rowGap: 26, pad: 24 };
const PLAN_LOCK = '<g class="plan-lock" transform="translate(152,11)">' +
  '<rect x="0" y="6" width="11" height="8" rx="2"/>' +
  '<path d="M1.9,6 V4.2 a3.6,3.6 0 0 1 7.2,0 V6 H7.5 V4.2 a2.1,2.1 0 0 0 -4.2,0 V6 Z"/></g>';

function planDep(name) {
  return String(name).split("/")[0];
}

function planDepths(epics) {
  const byName = {};
  for (const e of epics) byName[e.name] = e;
  const depth = {};
  const visit = (name, seen) => {
    if (depth[name] != null) return depth[name];
    if (seen.has(name)) return 0;
    seen.add(name);
    let d = 0;
    for (const dep of (byName[name] || {}).dependencies || []) {
      const from = planDep(dep);
      if (from !== name && byName[from]) d = Math.max(d, visit(from, seen) + 1);
    }
    seen.delete(name);
    depth[name] = d;
    return d;
  };
  for (const e of epics) visit(e.name, new Set());
  return depth;
}

function planLayout(epics, order) {
  const depth = planDepths(epics);
  const rank = {};
  order.forEach((name, i) => { rank[name] = i; });
  const at = e => (rank[e.name] == null ? order.length : rank[e.name]);
  const cols = [];
  let last = 0;
  for (const e of epics.slice().sort((a, b) => at(a) - at(b))) {
    const c = Math.max(depth[e.name] || 0, last);
    last = c;
    (cols[c] = cols[c] || []).push(e);
  }
  const rows = cols.reduce((a, col) => Math.max(a, col ? col.length : 0), 1);
  const nodes = {}, list = [];
  cols.forEach((col, c) => {
    const offset = (rows - col.length) / 2;
    col.forEach((epic, r) => {
      const node = {
        name: epic.name, epic, col: c, row: r, w: PLAN_BOX.w, h: PLAN_BOX.h,
        x: PLAN_BOX.pad + c * (PLAN_BOX.w + PLAN_BOX.colGap),
        y: PLAN_BOX.pad + (offset + r) * (PLAN_BOX.h + PLAN_BOX.rowGap),
      };
      nodes[epic.name] = node;
      list.push(node);
    });
  });
  return {
    nodes, list, depth, columns: cols.length,
    width: 2 * PLAN_BOX.pad + Math.max(1, cols.length) * (PLAN_BOX.w + PLAN_BOX.colGap) - PLAN_BOX.colGap,
    height: 2 * PLAN_BOX.pad + rows * (PLAN_BOX.h + PLAN_BOX.rowGap) - PLAN_BOX.rowGap,
  };
}

function planLink(from, to) {
  const fx = from.x + from.w / 2, fy = from.y + from.h / 2;
  const tx = to.x + to.w / 2, ty = to.y + to.h / 2;
  const gap = (from.w + to.w) / 2;
  let a;
  if (tx - fx > gap - 1) a = { x1: from.x + from.w, y1: fy, x2: to.x - 7, y2: ty, side: 1 };
  else if (fx - tx > gap - 1) a = { x1: from.x, y1: fy, x2: to.x + to.w + 7, y2: ty, side: -1 };
  else if (ty > fy) a = { x1: fx, y1: from.y + from.h, x2: tx, y2: to.y - 7, side: 0 };
  else a = { x1: fx, y1: from.y, x2: tx, y2: to.y + to.h + 7, side: 0 };
  const dx = Math.max(36, Math.abs(a.x2 - a.x1) * 0.5);
  const dy = Math.max(28, Math.abs(a.y2 - a.y1) * 0.45) * (a.y2 > a.y1 ? 1 : -1);
  if (a.side) {
    a.c1x = a.x1 + a.side * dx; a.c1y = a.y1; a.c2x = a.x2 - a.side * dx; a.c2y = a.y2;
  } else {
    a.c1x = a.x1; a.c1y = a.y1 + dy; a.c2x = a.x2; a.c2y = a.y2 - dy;
  }
  return a;
}

function planRound(v) {
  return Math.round(v * 10) / 10;
}

function planPath(a) {
  return `M${planRound(a.x1)},${planRound(a.y1)} C${planRound(a.c1x)},${planRound(a.c1y)} ` +
    `${planRound(a.c2x)},${planRound(a.c2y)} ${planRound(a.x2)},${planRound(a.y2)}`;
}

function planHead(a, back) {
  const dx = a.x2 - a.c2x, dy = a.y2 - a.c2y;
  const len = Math.hypot(dx, dy) || 1;
  return { x: a.x2 - dx / len * back, y: a.y2 - dy / len * back };
}

function planViolations(epics, order) {
  const at = {};
  order.forEach((name, i) => { at[name] = i; });
  const out = {};
  for (const e of epics) {
    for (const dep of e.dependencies || []) {
      const from = planDep(dep);
      if (at[from] == null || at[e.name] == null || at[from] < at[e.name]) continue;
      (out[e.name] = out[e.name] || []).push(from);
    }
  }
  return out;
}

function planReorder(order, name, target, locked) {
  if (!order.includes(name)) return { error: `unknown epic ${name}` };
  if (name === target) return { error: "same epic" };
  const next = order.filter(n => n !== name);
  const at = next.indexOf(target);
  if (at < 0) return { error: `unknown epic ${target}` };
  next.splice(at + 1, 0, name);
  const front = order.filter(n => locked.includes(n));
  if (next.slice(0, front.length).join("|") !== front.join("|")) return { error: "locked" };
  return { order: next };
}

function planNodeSvg(node, violations) {
  const e = node.epic;
  const status = String(e.status).replace(" ", "-");
  const bad = violations[e.name] || [];
  const label = e.title.length > 21 ? e.title.slice(0, 20) + "…" : e.title;
  const sub = bad.length ? "after " + bad.join(", ") : e.status;
  const tip = bad.length ? `planned before ${bad.join(", ")}` : e.locked ? "locked" : "drop an arrow head here";
  return `<g class="plan-node ${status}${e.locked ? " locked" : ""}${bad.length ? " violation" : ""}"
      data-node="${esc(e.name)}" transform="translate(${node.x},${node.y})"
      data-tip="${esc(e.title)}" data-sub="${esc(" · " + e.status + " · " + tip)}">
    <rect class="box" width="${node.w}" height="${node.h}" rx="10"/>
    <rect class="bar" x="1" y="9" width="4" height="${node.h - 18}" rx="2"/>
    <text class="title" x="16" y="21">${esc(label)}</text>
    <text class="sub" x="16" y="36">${esc(sub)}</text>
    ${e.locked ? PLAN_LOCK : ""}
  </g>`;
}

function planArrowSvg(from, to, locked, bad) {
  const link = planLink(from, to);
  const d = planPath(link);
  const head = planHead(link, 17);
  const tip = bad.length ? `${to.epic.title} is planned before ${bad.join(", ")}`
    : locked ? "locked" : `then ${to.epic.title}`;
  const sub = locked ? " · started epics keep their order" : " · drag the head onto an epic to move it";
  return {
    arrow: `<g class="plan-arrow${bad.length ? " bad" : ""}${locked ? " locked" : ""}"
        data-from="${esc(from.name)}" data-to="${esc(to.name)}">
      <path class="plan-order" d="${d}" marker-end="url(#plan-head${bad.length ? "-bad" : ""})"/>
      <path class="plan-hit" d="${d}" data-tip="${esc(tip)}" data-sub="${esc(sub)}"/></g>`,
    handle: locked ? "" : `<circle class="plan-handle${bad.length ? " bad" : ""}" cx="${planRound(head.x)}" cy="${planRound(head.y)}" r="7"
      data-handle="${esc(to.name)}" data-from="${esc(from.name)}"
      data-tip="${esc(to.epic.title)}" data-sub=" · drag onto an epic to plan it right after"/>`,
  };
}

function planSvg(layout, epics, order, view) {
  const violations = planViolations(epics, order);
  const marker = (id, color) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5"
    orient="auto-start-reverse"><path d="M0,1 L9.5,5 L0,9 z" fill="${color}"/></marker>`;
  const deps = [];
  for (const e of epics) {
    const to = layout.nodes[e.name];
    for (const dep of e.dependencies || []) {
      const from = layout.nodes[planDep(dep)];
      if (from && to && from !== to) {
        deps.push(`<path class="plan-dep" d="${planPath(planLink(from, to))}" marker-end="url(#plan-dep-head)"/>`);
      }
    }
  }
  const arrows = [], handles = [];
  for (let i = 0; i + 1 < order.length; i++) {
    const from = layout.nodes[order[i]], to = layout.nodes[order[i + 1]];
    if (!from || !to) continue;
    const link = planArrowSvg(from, to, from.epic.locked || to.epic.locked, violations[to.name] || []);
    arrows.push(link.arrow);
    handles.push(link.handle);
  }
  return `<svg id="plan-svg" role="img" aria-label="epic plan">
    <defs>${marker("plan-dep-head", "var(--ink-3)")}${marker("plan-head", "var(--plan-order)")}${marker("plan-head-bad", "var(--bad)")}</defs>
    <g id="plan-zoom" transform="translate(${view.x},${view.y}) scale(${view.k})">
      <g class="plan-deps">${deps.join("")}</g>
      <g class="plan-arrows">${arrows.join("")}</g>
      <g class="plan-nodes">${layout.list.map(n => planNodeSvg(n, violations)).join("")}</g>
      <g class="plan-handles">${handles.join("")}</g>
    </g></svg>`;
}
// --- end plan logic ---

let planDrag = null, planSig = "", planLayoutCache = null, planNoteTimer = 0;

function planLockedNames(d) {
  return d.order.filter(name => (d.epics.find(e => e.name === name) || {}).locked);
}

function applyPlanView() {
  const g = document.getElementById("plan-zoom");
  if (g) g.setAttribute("transform", `translate(${state.planView.x},${state.planView.y}) scale(${state.planView.k})`);
}

function planZoom(factor, px, py) {
  const v = state.planView;
  const k = Math.max(0.25, Math.min(2.5, v.k * factor));
  const cx = px == null ? 320 : px, cy = py == null ? 220 : py;
  v.x = cx - (cx - v.x) * (k / v.k);
  v.y = cy - (cy - v.y) * (k / v.k);
  v.k = k;
  applyPlanView();
  saveSoon();
}

function planFit() {
  const svg = document.getElementById("plan-svg");
  if (!svg || !planLayoutCache) return;
  const box = svg.getBoundingClientRect();
  const k = Math.max(0.25, Math.min(1.2, (box.width - 24) / planLayoutCache.width, (box.height - 24) / planLayoutCache.height));
  state.planView = { x: 12, y: Math.max(12, (box.height - planLayoutCache.height * k) / 2), k };
  applyPlanView();
  saveUi();
}

function planNote(text, bad) {
  const note = document.getElementById("plan-note");
  if (!note) return;
  note.textContent = text;
  note.classList.toggle("bad", !!bad);
  clearTimeout(planNoteTimer);
  planNoteTimer = setTimeout(() => { note.textContent = ""; }, bad ? 6000 : 1600);
}

function planPoint(ev) {
  const box = document.getElementById("plan-svg").getBoundingClientRect();
  return {
    x: (ev.clientX - box.left - state.planView.x) / state.planView.k,
    y: (ev.clientY - box.top - state.planView.y) / state.planView.k,
  };
}

function planPan(ev, svg) {
  const v = state.planView;
  const ox = ev.clientX - v.x, oy = ev.clientY - v.y;
  svg.classList.add("panning");
  const move = e => { v.x = e.clientX - ox; v.y = e.clientY - oy; applyPlanView(); };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    svg.classList.remove("panning");
    saveUi();
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}

function planDropTarget(ev) {
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const node = el && el.closest ? el.closest("[data-node]") : null;
  return node ? node.dataset.node : null;
}

function planStartDrag(ev, svg, handle) {
  const d = state.plan;
  const name = handle.dataset.handle;
  const arrow = svg.querySelector(`.plan-arrow[data-to="${name}"]`);
  const ghost = document.createElementNS("http://www.w3.org/2000/svg", "path");
  ghost.setAttribute("class", "plan-ghost");
  document.getElementById("plan-zoom").appendChild(ghost);
  arrow.classList.add("dragging");
  planDrag = { name, locked: planLockedNames(d) };
  const source = planLayoutCache.nodes[handle.dataset.from];
  let hover = null;
  const paint = at => {
    const p = planPoint(at);
    ghost.setAttribute("d", planPath(planLink(source, { x: p.x - 4, y: p.y - 4, w: 8, h: 8 })));
    const target = planDropTarget(at);
    if (hover && hover.dataset.node !== target) hover.classList.remove("drop", "drop-bad");
    hover = target ? svg.querySelector(`[data-node="${target}"]`) : null;
    if (!hover) return;
    const move = planReorder(d.order, name, target, planDrag.locked);
    hover.classList.toggle("drop", !move.error);
    hover.classList.toggle("drop-bad", !!move.error);
  };
  const drop = at => {
    window.removeEventListener("mousemove", paint);
    window.removeEventListener("mouseup", drop);
    ghost.remove();
    arrow.classList.remove("dragging");
    if (hover) hover.classList.remove("drop", "drop-bad");
    const target = planDropTarget(at);
    const move = target ? planReorder(d.order, name, target, planDrag.locked) : { error: "" };
    planDrag = null;
    if (move.error === "locked") planNote("locked", true);
    else if (!move.error) planSavePlan(move.order);
  };
  window.addEventListener("mousemove", paint);
  window.addEventListener("mouseup", drop);
  paint(ev);
}

function bindPlan(el) {
  const svg = el.querySelector("#plan-svg");
  if (!svg) return;
  el.querySelector("#plan-in").onclick = () => planZoom(1.25);
  el.querySelector("#plan-out").onclick = () => planZoom(1 / 1.25);
  el.querySelector("#plan-fit").onclick = planFit;
  svg.onwheel = ev => {
    ev.preventDefault();
    const box = svg.getBoundingClientRect();
    planZoom(Math.exp(-ev.deltaY * 0.0022), ev.clientX - box.left, ev.clientY - box.top);
  };
  svg.onmousedown = ev => {
    if (ev.button) return;
    ev.preventDefault();
    const handle = ev.target.closest("[data-handle]");
    if (handle) planStartDrag(ev, svg, handle);
    else planPan(ev, svg);
  };
}

async function planSavePlan(order) {
  const previous = state.plan.order;
  state.plan = { ...state.plan, order };
  renderPlan(true);
  try {
    const r = await fetch("/api/plan", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ order }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "the server refused the order");
    state.plan = data;
    renderPlan(true);
    planNote("saved");
  } catch (err) {
    state.plan = { ...state.plan, order: previous };
    renderPlan(true);
    planNote(String(err.message || err), true);
  }
}

function renderPlan(force) {
  const el = document.getElementById("plan");
  const d = state.plan;
  if (!d) { el.innerHTML = `<div class="empty-state">Loading the plan…</div>`; return; }
  if (d.stale) { el.innerHTML = `<div class="empty-state">This server predates this page. Restart it: <code>python3 project/pm.py serve</code></div>`; return; }
  if (!d.epics.length) { el.innerHTML = `<div class="empty-state">No epics yet</div>`; return; }
  const sig = JSON.stringify([d.order, d.epics.map(e => [e.name, e.title, e.status, e.dependencies])]);
  if (!force && sig === planSig && el.querySelector("#plan-svg")) { applyPlanView(); return; }
  planSig = sig;
  const fit = !state.planView;
  if (fit) state.planView = { x: 12, y: 12, k: 1 };
  planLayoutCache = planLayout(d.epics, d.order);
  el.innerHTML = `<div class="plan-tools">
      <span class="hint">drag an arrow head onto an epic · drag the background to pan</span>
      <span class="plan-note" id="plan-note"></span>
      <button id="plan-out" title="Zoom out">−</button><button id="plan-in" title="Zoom in">+</button>
      <button id="plan-fit" title="Fit the diagram">fit</button>
    </div>` + planSvg(planLayoutCache, d.epics, d.order, state.planView);
  bindPlan(el);
  bindTips(el);
  if (fit) planFit();
}

function render() {
  if (!state.data) return;
  if (!state.epic && state.data.epics.length) {
    state.epic = (state.data.epics.find(e => e.status === "in progress") || state.data.epics[0]).path;
  }
  renderHeader();
  renderEpics();
  applyView();
  if (state.view === "board") renderBoard();
  else if (state.view === "timeline") renderTimeline();
  else if (state.view === "plan") renderPlan();
  else if (state.view === "tests") renderTests();
  else renderBenchmarks();
  if (state.item && (state.view === "board" || state.view === "timeline")) openPanel(state.item);
  else closePanel();
  saveUi();
}

async function loadApi(path) {
  const r = await fetch(path);
  if (r.status === 404) return { stale: true };
  return r.json();
}

async function loadView() {
  if (state.view === "tests") state.tests = await loadApi("/api/tests");
  if (state.view === "benchmarks") state.bench = await loadApi("/api/benchmarks");
  if (state.view === "plan") state.plan = await loadApi("/api/plan");
}

async function refresh() {
  if (planDrag) return;
  try {
    const r = await fetch("/api/state");
    state.data = await r.json();
    await loadView();
    render();
  } catch (e) {
    document.getElementById("generated").textContent = "server unreachable";
  }
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  applyView();
  render();
  saveSoon();
  refresh();
});
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("view")) state.view = h.get("view");
  if (h.get("epic")) state.epic = h.get("epic");
  if (h.get("item")) state.item = h.get("item");
  applyView();
  render();
}
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.data && (state.view === "tests" || state.view === "benchmarks")) render();
  }, 150);
});
loadUi();
applyView();
trackScroll(document.getElementById("content"), () => CONTENT_KEY[state.view] || "content");
trackScroll(document.querySelector("aside"), "aside");
trackScroll(document.getElementById("panel"), "panel");
window.onhashchange = () => { applyHash(); refresh(); };
window.addEventListener("pagehide", saveUi);
applyHash();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
