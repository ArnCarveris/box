// --- plan logic (extracted by test_pm.py, keep free of DOM access) ---
const PLAN_BOX = { w: 174, h: 46, colGap: 58, rowGap: 12, bandGap: 26, pad: 20, label: 136 };
const PLAN_PRIORITY = 100;

function planDep(name) {
  return String(name).split("/")[0];
}

function planTitle(item) {
  return (item.readme && item.readme.title) || item.name;
}

function planPriority(epic) {
  return typeof epic.priority === "number" ? epic.priority : PLAN_PRIORITY;
}

function planEpics(epics) {
  return (epics || []).slice().sort((a, b) => planPriority(a) - planPriority(b)
    || String(a.created || "").localeCompare(String(b.created || ""))
    || String(a.name).localeCompare(String(b.name)));
}

function planTasks(epics, filter) {
  const f = filter || {};
  const tasks = [];
  for (const epic of planEpics(epics)) {
    for (const task of epic.children || []) {
      if (task.level === "subtask") continue;
      const subs = task.children || [];
      const done = task.status === "complete" || task.status === "discarded";
      if ((f.epic && epic.name !== f.epic) || (f.open && done)) continue;
      const deps = [];
      for (const list of [task.dependencies || []].concat(subs.map(s => s.dependencies || []))) {
        for (const dep of list) if (!deps.includes(String(dep))) deps.push(String(dep));
      }
      tasks.push({
        path: task.path, name: task.name, title: planTitle(task), status: task.status, done,
        epic: epic.name, epicTitle: planTitle(epic), subs: subs.length, deps,
      });
    }
  }
  return tasks;
}

function planGraph(tasks) {
  const byPath = {}, last = {}, into = {}, out = {}, edges = [];
  for (const task of tasks) { byPath[task.path] = task; last[task.epic] = task.path; }
  for (const task of tasks) {
    for (const dep of task.deps) {
      const parts = dep.split("/");
      const path = parts.length > 1 ? parts[0] + "/" + parts[1] : null;
      const from = path ? (byPath[path] ? path : null) : last[parts[0]] || null;
      if (!from || from === task.path || (into[task.path] || []).includes(from)) continue;
      (into[task.path] = into[task.path] || []).push(from);
      (out[from] = out[from] || []).push(task.path);
      edges.push({ from, to: task.path, cross: byPath[from].epic !== task.epic });
    }
  }
  return { byPath, into, out, edges };
}

function planDepths(tasks, into) {
  const depth = {};
  const visit = (path, seen) => {
    if (depth[path] != null) return depth[path];
    if (seen.has(path)) return 0;
    seen.add(path);
    let d = 0;
    for (const from of into[path] || []) d = Math.max(d, visit(from, seen) + 1);
    seen.delete(path);
    depth[path] = d;
    return d;
  };
  for (const task of tasks) visit(task.path, new Set());
  return depth;
}

function planLayout(epics, filter) {
  const tasks = planTasks(epics, filter);
  const graph = planGraph(tasks);
  const depth = planDepths(tasks, graph.into);
  const groups = {}, order = [];
  for (const task of tasks) {
    if (!groups[task.epic]) { groups[task.epic] = []; order.push(task.epic); }
    groups[task.epic].push(task);
  }
  const nodes = {}, list = [], bands = [];
  let top = PLAN_BOX.pad, columns = 0;
  for (const name of order) {
    const group = groups[name];
    const used = {};
    let rows = 1;
    for (const task of group) {
      const col = depth[task.path] || 0;
      const row = used[col] = used[col] == null ? 0 : used[col] + 1;
      rows = Math.max(rows, row + 1);
      columns = Math.max(columns, col + 1);
      const node = {
        name: task.path, task, col, row, w: PLAN_BOX.w, h: PLAN_BOX.h,
        x: PLAN_BOX.pad + PLAN_BOX.label + col * (PLAN_BOX.w + PLAN_BOX.colGap),
        y: top + row * (PLAN_BOX.h + PLAN_BOX.rowGap),
      };
      nodes[task.path] = node;
      list.push(node);
    }
    const height = rows * (PLAN_BOX.h + PLAN_BOX.rowGap) - PLAN_BOX.rowGap;
    bands.push({ epic: name, title: group[0].epicTitle, tasks: group.length, y: top, height });
    top += height + PLAN_BOX.bandGap;
  }
  return {
    nodes, list, bands, depth, columns, edges: graph.edges, into: graph.into, out: graph.out,
    width: 2 * PLAN_BOX.pad + PLAN_BOX.label + Math.max(1, columns) * (PLAN_BOX.w + PLAN_BOX.colGap) - PLAN_BOX.colGap,
    height: bands.length ? top - PLAN_BOX.bandGap + PLAN_BOX.pad : 2 * PLAN_BOX.pad,
  };
}

function planRelated(layout, path) {
  return {
    nodes: [path].concat(layout.into[path] || [], layout.out[path] || []),
    edges: layout.edges.filter(e => e.from === path || e.to === path).map(e => e.from + " > " + e.to),
  };
}

function planLink(from, to) {
  const fx = from.x + from.w / 2, fy = from.y + from.h / 2;
  const tx = to.x + to.w / 2, ty = to.y + to.h / 2;
  const gap = (from.w + to.w) / 2;
  let a;
  if (tx - fx > gap - 1) a = { x1: from.x + from.w, y1: fy, x2: to.x - 7, y2: ty, side: 1 };
  else if (fx - tx > gap - 1) a = { x1: from.x, y1: fy, x2: to.x + to.w + 7, y2: ty, side: -1 };
  else if (ty > fy) a = { x1: fx, y1: from.y + from.h, x2: tx, y2: to.y - 7, side: 0 };
  else a = { x1: fx, y1: from.y, x2: tx, y2: to.y + to.h + 7, side: 0 };
  const dx = Math.max(36, Math.abs(a.x2 - a.x1) * 0.5);
  const dy = Math.max(28, Math.abs(a.y2 - a.y1) * 0.45) * (a.y2 > a.y1 ? 1 : -1);
  if (a.side) {
    a.c1x = a.x1 + a.side * dx; a.c1y = a.y1; a.c2x = a.x2 - a.side * dx; a.c2y = a.y2;
  } else {
    a.c1x = a.x1; a.c1y = a.y1 + dy; a.c2x = a.x2; a.c2y = a.y2 - dy;
  }
  return a;
}

function planRound(v) {
  return Math.round(v * 10) / 10;
}

function planPath(a) {
  return `M${planRound(a.x1)},${planRound(a.y1)} C${planRound(a.c1x)},${planRound(a.c1y)} ` +
    `${planRound(a.c2x)},${planRound(a.c2y)} ${planRound(a.x2)},${planRound(a.y2)}`;
}

function planNodeSvg(node, layout) {
  const task = node.task;
  const status = String(task.status).replace(" ", "-");
  const label = task.title.length > 23 ? task.title.slice(0, 22) + "…" : task.title;
  const deps = layout.into[task.path] || [], dependents = layout.out[task.path] || [];
  const sub = task.name + (task.subs ? " · " + task.subs + (task.subs > 1 ? " subtasks" : " subtask") : "");
  const tip = " · " + task.epicTitle + " · " + task.status
    + (deps.length ? " · after " + deps.join(", ") : "")
    + (dependents.length ? " · blocks " + dependents.join(", ") : "");
  return `<g class="plan-node ${status}" data-node="${esc(task.path)}" data-epic="${esc(task.epic)}"
      transform="translate(${node.x},${node.y})" data-tip="${esc(task.title)}" data-sub="${esc(tip)}">
    <rect class="box" width="${node.w}" height="${node.h}" rx="9"/>
    <rect class="bar" x="1" y="9" width="4" height="${node.h - 18}" rx="2"/>
    <text class="title" x="15" y="20">${esc(label)}</text>
    <text class="sub" x="15" y="35">${esc(sub)}</text>
  </g>`;
}

function planSvg(layout, view) {
  const marker = (id, color) => `<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5"
    orient="auto-start-reverse"><path d="M0,1 L9.5,5 L0,9 z" fill="${color}"/></marker>`;
  const bands = layout.bands.map(b => `<g class="plan-band" data-band="${esc(b.epic)}">
    <rect x="${PLAN_BOX.pad / 2}" y="${planRound(b.y - 9)}" width="${layout.width - PLAN_BOX.pad}"
      height="${planRound(b.height + 18)}" rx="10"/>
    <text x="${PLAN_BOX.pad}" y="${planRound(b.y + 14)}">${esc(b.title)}</text>
    <text class="count" x="${PLAN_BOX.pad}" y="${planRound(b.y + 30)}">${b.tasks} ${b.tasks > 1 ? "tasks" : "task"}</text>
  </g>`).join("");
  const edges = layout.edges.map(e => {
    const from = layout.nodes[e.from], to = layout.nodes[e.to];
    if (!from || !to) return "";
    return `<path class="plan-dep${e.cross ? " cross" : ""}" d="${planPath(planLink(from, to))}"
      marker-end="url(#plan-dep-head${e.cross ? "-cross" : ""})" data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
  }).join("");
  return `<svg id="plan-svg" role="img" aria-label="task plan">
    <defs>${marker("plan-dep-head", "var(--ink-3)")}${marker("plan-dep-head-cross", "var(--ink-2)")}</defs>
    <g id="plan-zoom" transform="translate(${view.x},${view.y}) scale(${view.k})">
      <g class="plan-bands">${bands}</g>
      <g class="plan-edges">${edges}</g>
      <g class="plan-nodes">${layout.list.map(n => planNodeSvg(n, layout)).join("")}</g>
    </g></svg>`;
}
// --- end plan logic ---

let planSig = "", planLayoutCache = null;

function applyPlanView() {
  const g = document.getElementById("plan-zoom");
  if (g) g.setAttribute("transform", `translate(${state.planView.x},${state.planView.y}) scale(${state.planView.k})`);
}

function planZoom(factor, px, py) {
  const v = state.planView;
  const k = Math.max(0.15, Math.min(2.5, v.k * factor));
  const cx = px == null ? 320 : px, cy = py == null ? 220 : py;
  v.x = cx - (cx - v.x) * (k / v.k);
  v.y = cy - (cy - v.y) * (k / v.k);
  v.k = k;
  applyPlanView();
  saveSoon();
}

function planFit() {
  const svg = document.getElementById("plan-svg");
  if (!svg || !planLayoutCache) return;
  const box = svg.getBoundingClientRect();
  const k = Math.max(0.15, Math.min(1.2, (box.width - 24) / planLayoutCache.width, (box.height - 68) / planLayoutCache.height));
  state.planView = { x: 12, y: Math.max(48, (box.height - planLayoutCache.height * k) / 2), k };
  applyPlanView();
  saveUi();
}

function planHover(svg, path) {
  svg.querySelectorAll(".lit").forEach(el => el.classList.remove("lit"));
  if (!path) { svg.classList.remove("hover"); return; }
  const related = planRelated(planLayoutCache, path);
  for (const name of related.nodes) svg.querySelector(`[data-node="${name}"]`)?.classList.add("lit");
  for (const edge of related.edges) {
    const [from, to] = edge.split(" > ");
    svg.querySelector(`.plan-dep[data-from="${from}"][data-to="${to}"]`)?.classList.add("lit");
  }
  svg.classList.add("hover");
}

function planPan(ev, svg) {
  const v = state.planView;
  const ox = ev.clientX - v.x, oy = ev.clientY - v.y;
  svg.classList.add("panning");
  const move = e => { v.x = e.clientX - ox; v.y = e.clientY - oy; applyPlanView(); };
  const up = () => {
    window.removeEventListener("mousemove", move);
    window.removeEventListener("mouseup", up);
    svg.classList.remove("panning");
    saveUi();
  };
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
}

function bindPlan(el) {
  const svg = el.querySelector("#plan-svg");
  el.querySelector("#plan-epic").onchange = ev => {
    state.planFilter = { ...state.planFilter, epic: ev.target.value };
    state.planView = null;
    renderPlan(true);
    saveUi();
  };
  el.querySelector("#plan-open").onchange = ev => {
    state.planFilter = { ...state.planFilter, open: ev.target.checked };
    state.planView = null;
    renderPlan(true);
    saveUi();
  };
  if (!svg) return;
  el.querySelector("#plan-in").onclick = () => planZoom(1.25);
  el.querySelector("#plan-out").onclick = () => planZoom(1 / 1.25);
  el.querySelector("#plan-fit").onclick = planFit;
  svg.onwheel = ev => {
    ev.preventDefault();
    const box = svg.getBoundingClientRect();
    planZoom(Math.exp(-ev.deltaY * 0.0022), ev.clientX - box.left, ev.clientY - box.top);
  };
  svg.onmousedown = ev => {
    if (ev.button) return;
    ev.preventDefault();
    planPan(ev, svg);
  };
  svg.querySelectorAll("[data-node]").forEach(node => {
    node.addEventListener("mouseenter", () => planHover(svg, node.dataset.node));
    node.addEventListener("mouseleave", () => planHover(svg, null));
    node.onclick = () => openPanel(node.dataset.node);
  });
}

async function savePriority(name, value) {
  const note = () => document.getElementById("prio-note");
  const number = Math.round(Number(value));
  if (!String(value).trim() || !Number.isFinite(number)) {
    note().textContent = "priority must be a whole number";
    note().classList.add("bad");
    return;
  }
  try {
    const r = await fetch("/api/priority", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ epic: name, priority: number }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "the server refused the priority");
    planSig = "";
    await refresh();
    if (note()) { note().textContent = "saved"; note().classList.remove("bad"); }
  } catch (err) {
    if (note()) { note().textContent = String(err.message || err); note().classList.add("bad"); }
  }
}

function renderPlan(force) {
  const el = document.getElementById("plan");
  const epics = state.data ? state.data.epics : [];
  if (!epics.length) { el.innerHTML = `<div class="empty-state">No epics yet</div>`; return; }
  const filter = state.planFilter;
  const sig = JSON.stringify([filter, epics.map(e => [e.name, e.priority, e.children.map(t =>
    [t.path, t.status, t.dependencies, t.children.map(s => s.dependencies)])])]);
  if (!force && sig === planSig && el.querySelector("#plan-svg")) { applyPlanView(); return; }
  planSig = sig;
  const fit = !state.planView;
  if (fit) state.planView = { x: 12, y: 12, k: 1 };
  planLayoutCache = planLayout(epics, filter);
  const options = planEpics(epics).map(e =>
    `<option value="${esc(e.name)}"${filter.epic === e.name ? " selected" : ""}>${esc(planTitle(e))}</option>`).join("");
  el.innerHTML = `<div class="plan-tools">
      <span class="hint">drag to pan · scroll to zoom · hover a task for its links</span>
      <select id="plan-epic" title="Show one epic"><option value="">all epics</option>${options}</select>
      <label title="Hide complete and discarded tasks">
        <input type="checkbox" id="plan-open"${filter.open ? " checked" : ""}>unfinished only</label>
      <button id="plan-out" title="Zoom out">−</button><button id="plan-in" title="Zoom in">+</button>
      <button id="plan-fit" title="Fit the diagram">fit</button>
    </div>` + (planLayoutCache.list.length
      ? planSvg(planLayoutCache, state.planView)
      : `<div class="empty-state">No tasks match the filter</div>`);
  bindPlan(el);
  bindTips(el);
  if (fit) planFit();
}

function render() {
  if (!state.data) return;
  if (!state.epic && state.data.epics.length) {
    state.epic = (state.data.epics.find(e => e.status === "in progress") || state.data.epics[0]).path;
  }
  renderHeader();
  renderEpics();
  applyView();
  if (state.view === "board") renderBoard();
  else if (state.view === "timeline") renderTimeline();
  else if (state.view === "plan") renderPlan();
  else if (state.view === "tests") renderTests();
  else renderBenchmarks();
  if (state.item && (state.view === "board" || state.view === "timeline")) openPanel(state.item);
  else closePanel();
  saveUi();
}

async function loadApi(path) {
  const r = await fetch(path);
  if (r.status === 404) return { stale: true };
  return r.json();
}

async function loadView() {
  if (state.view === "tests") state.tests = await loadApi("/api/tests");
  if (state.view === "benchmarks") state.bench = await loadApi("/api/benchmarks");
}

async function refresh() {
  try {
    const r = await fetch("/api/state");
    state.data = await r.json();
    await loadView();
    render();
  } catch (e) {
    document.getElementById("generated").textContent = "server unreachable";
  }
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  applyView();
  render();
  saveSoon();
  refresh();
});
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("view")) state.view = h.get("view");
  if (h.get("epic")) state.epic = h.get("epic");
  if (h.get("item")) state.item = h.get("item");
  applyView();
  render();
}
let resizeTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.data && (state.view === "tests" || state.view === "benchmarks")) render();
  }, 150);
});
loadUi();
applyView();
trackScroll(document.getElementById("content"), () => CONTENT_KEY[state.view] || "content");
trackScroll(document.querySelector("aside"), "aside");
trackScroll(document.getElementById("panel"), "panel");
window.onhashchange = () => { applyHash(); refresh(); };
window.addEventListener("pagehide", saveUi);
applyHash();
refresh();
setInterval(refresh, 5000);
</script>
