<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Box Project</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f4f4f1;
  --surface: #ffffff;
  --surface-2: #f9f9f7;
  --border: #e3e2dc;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #8a8983;
  --accent: #2a78d6;
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #d63a2a;
  --pending: #b3b2ab;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.18);
  --radius: 12px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --band: #eae8e1;
}
:root:not([data-theme="light"]) { color-scheme: light dark; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --border: #2f2f2d;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #85847c; --accent: #3987e5;
    --pending: #56554f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --band: #232322;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --surface-2: #232322; --border: #2f2f2d;
  --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #85847c; --accent: #3987e5;
  --pending: #56554f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); --band: #232322;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow-x: hidden; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }

header {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
header .meta { color: var(--ink-3); font-size: 12px; }
.tiles { display: flex; gap: 8px; margin-left: auto; }
.tile {
  display: flex; flex-direction: column; padding: 6px 12px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); min-width: 84px;
}
.tile b { font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.tabs button { padding: 4px 12px; border-radius: 6px; color: var(--ink-2); }
.tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.icon-btn { padding: 6px; border-radius: 8px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); }

main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--border); overflow: auto; padding: 12px; background: var(--surface); }
aside h2, .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 8px 8px 6px; font-weight: 600; }
.epic {
  display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; margin-bottom: 4px;
}
.epic:hover { background: var(--surface-2); }
.epic.active { background: var(--surface-2); outline: 1px solid var(--border); }
.epic .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.epic .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
.bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 8px; display: flex; overflow: hidden; gap: 1px; }
.bar i { display: block; height: 100%; }
.bar .done { background: var(--good); }
.bar .active { background: var(--accent); }

.content { overflow: auto; overflow-x: hidden; min-height: 0; position: relative; }
.board { padding: 20px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); align-content: start; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
}
.card.pending { opacity: .85; }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; cursor: pointer; }
.card-head h3:hover { color: var(--accent); }
.brief { color: var(--ink-2); font-size: 13px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; color: var(--ink-2);
}
.chip svg { width: 10px; height: 10px; }
.chip.complete { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.in-progress { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); text-decoration: none; }
.chip.pending { color: var(--ink-3); border-color: var(--border); }
.chip.discarded { color: var(--ink-3); border-color: var(--border); text-decoration: line-through; }
.chip.pass { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.chip.fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.chip.empty { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.kind { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
.link { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.link:hover { text-decoration: underline; }
.card-head .link { align-self: center; }
.subtasks { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; }
.subtasks li {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; cursor: pointer;
}
.subtasks li:hover { background: var(--surface-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pending); flex: none; }
.dot.complete { background: var(--good); }
.dot.in-progress { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.discarded { background: transparent; border: 1px solid var(--ink-3); }
.subtasks li .t { flex: 1; }
.subtasks li.discarded .t { text-decoration: line-through; color: var(--ink-3); }
.subtasks li time { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.tests { display: flex; gap: 10px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; align-items: center; }
.tests b.ok { color: var(--good); } .tests b.bad { color: var(--bad); } .tests b.empty { color: var(--warn); }
.deps { font-size: 12px; color: var(--ink-3); }
.deps code { font-family: var(--mono); font-size: 11px; }
.prio { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.prio input {
  font: inherit; width: 72px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px;
}
.empty-state { color: var(--ink-3); padding: 60px; text-align: center; }

.panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 90%); background: var(--surface);
  border-left: 1px solid var(--border); box-shadow: var(--shadow); overflow: auto; padding: 20px 24px;
  transform: translateX(101%); transition: transform .18s ease; z-index: 5;
}
.panel.open { transform: none; }
.panel .close { position: absolute; top: 12px; right: 12px; }
.panel .path { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.panel h1 { font-size: 20px; margin: 4px 0 8px; }
.panel .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.md { font-size: 14px; }
.md h1 { display: none; }
.md h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin: 18px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul { padding-left: 20px; margin: 0 0 10px; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12px; }
.deliverables { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.deliverables li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.deliverables li .n { flex: 1; font-family: var(--mono); font-size: 12px; }
.deliverables img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; }
.readme-deliverable { margin-top: 10px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }

.timeline { display: grid; grid-template-columns: 300px 1fr; height: 100%; min-height: 0; position: relative; }
.tl-labels { overflow: hidden; border-right: 1px solid var(--border); background: var(--surface); }
.tl-scroll { overflow: auto; position: relative; }
.tl-row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 13px; }
.tl-row.epic-row { background: var(--surface-2); font-weight: 600; }
.tl-row.task-row { padding-left: 24px; }
.tl-row.sub-row { padding-left: 44px; color: var(--ink-2); font-size: 12px; }
.tl-row .lbl { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.tl-row .lbl:hover { color: var(--accent); }
.tl-head { position: sticky; top: 0; height: 40px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 2; }
.tl-head .day { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--border); padding: 4px 6px; font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tl-head .day small { display: block; color: var(--ink-3); }
.tl-body { position: relative; }
.tl-grid-row { height: 30px; border-bottom: 1px solid var(--border); position: relative; }
.tl-grid-row.epic-row { background: var(--surface-2); }
.tl-bar { position: absolute; top: 8px; height: 14px; border-radius: 4px; background: var(--pending); min-width: 3px; cursor: pointer; }
.tl-bar.complete { background: var(--good); }
.tl-bar.in-progress { background: var(--accent); }
.tl-bar.in-progress::after {
  content: ""; position: absolute; right: -1px; top: 0; bottom: 0; width: 14px; border-radius: 0 4px 4px 0;
  background: repeating-linear-gradient(135deg, transparent 0 3px, rgba(255,255,255,.45) 3px 6px);
}
.tl-bar.discarded { background: transparent; border: 1px dashed var(--ink-3); }
.tl-bar.epic-bar { top: 11px; height: 8px; opacity: .6; }
.tl-now { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--bad); z-index: 1; pointer-events: none; }
.tl-vline { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--border); pointer-events: none; }
.tl-tools { position: absolute; right: 16px; top: 8px; z-index: 3; display: flex; gap: 4px; }
.tl-tools button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.page { padding: 20px; display: grid; gap: 16px; align-content: start; }
.page .card { gap: 12px; overflow-x: auto; }
.page h2 { margin: 0; }
.card-title { display: flex; align-items: baseline; gap: 10px; }
.card-title h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-title span { color: var(--ink-3); font-size: 12px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
table.data tr:last-child td { border-bottom: 0; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data td.mono { font-family: var(--mono); font-size: 12px; }
td .ok { color: var(--good); } td .bad { color: var(--bad); } td .empty { color: var(--warn); }
.muted { color: var(--ink-3); }
.chart { display: flex; flex-direction: column; gap: 6px; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart .ax { fill: var(--ink-3); font-size: 10px; }
.chart .ax-title { fill: var(--ink-3); font-size: 10px; letter-spacing: .04em; }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: default; }
.spark { display: block; }
.tw { display: inline-block; width: 14px; color: var(--ink-2); font-size: 11px; }
td .dot { display: inline-block; vertical-align: middle; margin-right: 4px; }
table.data.sub { margin: 2px 0 8px; }
table.data.sub th, table.data.sub td { padding: 4px 8px; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.legend span, .legend button { display: inline-flex; align-items: center; gap: 6px; }
.legend button { padding: 1px 5px; border-radius: 5px; color: var(--ink-2); }
.legend button:hover { background: var(--surface-2); color: var(--ink); }
.legend button.off { opacity: .45; text-decoration: line-through; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(122px, 1fr)); gap: 8px; }
.stat {
  display: flex; flex-direction: column; gap: 1px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
}
.stat span { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.stat b { font-size: 19px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat b small { font-size: 11px; font-weight: 400; color: var(--ink-3); }
.stat .spark { margin-top: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input {
  font: inherit; flex: 1 1 180px; min-width: 110px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
}
.tools button { border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.tools button:hover { background: var(--surface-2); color: var(--ink); }
.tools .muted { font-size: 12px; }
.more { font-size: 12px; color: var(--ink-2); align-self: start; padding: 2px 0; }
.more:hover { color: var(--ink); }
.tree { display: flex; flex-direction: column; min-width: 0; }
.trow { display: grid; grid-template-columns: var(--cols); gap: 0 8px; align-items: center; border-bottom: 1px solid var(--border); }
.trow .cell { padding: 5px 4px; font-size: 13px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.trow.thead .cell {
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3);
  font-weight: 600; text-align: left; border-radius: 6px;
}
.trow.thead .cell.num { text-align: right; }
.trow.thead .cell:hover { color: var(--ink); background: var(--surface-2); }
.trow.thead .cell.sorted { color: var(--ink); }
.cell.num { text-align: right; font-variant-numeric: tabular-nums; }
.cell.name { display: flex; align-items: center; gap: 6px; padding-left: calc(4px + var(--depth) * 15px); }
.cell.name .nm { overflow: hidden; text-overflow: ellipsis; }
.cell.name .nt { font-size: 11px; flex: 0 100 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cell.status { display: flex; gap: 4px; align-items: center; }
.cell.trend { display: flex; justify-content: flex-end; }
.trow.lvl-project { background: var(--surface-2); }
.trow.lvl-project .nm { font-weight: 650; }
.trow.lvl-suite .nm, .trow.lvl-scene .nm { font-weight: 600; }
.trow.lvl-case .nm { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.trow[data-toggle] { cursor: pointer; }
.trow[data-toggle]:hover { background: var(--band); }
.trow.open { box-shadow: inset 2px 0 0 var(--accent); }
.cell.meta {
  display: none; grid-column: 1 / -1; padding: 0 4px 6px calc(19px + var(--depth) * 15px);
  color: var(--ink-3); font-size: 11px; white-space: normal;
}
.tree-detail {
  padding: 10px 6px 14px calc(19px + var(--depth) * 15px); border-bottom: 1px solid var(--border);
  box-shadow: inset 2px 0 0 var(--accent);
}
.tree-detail .card-title { margin-bottom: 6px; }
.tree-note { color: var(--ink-3); font-size: 11px; padding: 6px 4px; }
.tree.t-tests { --cols: minmax(130px, 1fr) 54px 150px 78px 92px 156px; }
.tree.t-bench { --cols: minmax(130px, 1fr) 56px 80px 80px 64px 76px 62px 70px 74px 92px; }
.tree.t-scenes { --cols: minmax(130px, 1fr) 72px 72px 72px 78px 78px 64px 92px; }
@media (max-width: 1240px) {
  .tree.t-tests { --cols: minmax(130px, 1fr) 54px 150px 78px 92px; }
  .tree.t-bench { --cols: minmax(130px, 1fr) 56px 86px 86px 92px; }
  .tree.t-scenes { --cols: minmax(130px, 1fr) 72px 78px 78px 64px 92px; }
  .cell.c-wide { display: none; }
  .cell.meta { display: block; }
}
@media (max-width: 760px) {
  .tree.t-tests { --cols: minmax(110px, 1fr) 128px 74px; }
  .tree.t-bench { --cols: minmax(110px, 1fr) 86px; }
  .tree.t-scenes { --cols: minmax(110px, 1fr) 74px 74px; }
  .cell.c-mid { display: none; }
}
.plan { position: relative; height: 100%; min-height: 0; overflow: hidden; }
#plan-svg { display: block; width: 100%; height: 100%; background: var(--surface); cursor: grab; }
#plan-svg.panning { cursor: grabbing; }
#plan-svg text { user-select: none; }
.plan-tools {
  position: absolute; right: 16px; top: 12px; z-index: 3; display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 32px);
}
.plan-tools button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 2px 9px; font-size: 12px; }
.plan-tools select {
  font: inherit; font-size: 12px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px;
}
.plan-tools label { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.plan-tools .hint { color: var(--ink-3); font-size: 11px; }
.plan-note { font-size: 12px; font-weight: 600; color: var(--good); }
.plan-note.bad { color: var(--bad); }
.plan-band rect { fill: var(--band); }
.plan-band text { fill: var(--ink-2); font-size: 12px; font-weight: 650; }
.plan-band .count { fill: var(--ink-3); font-size: 10px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.plan-node rect.box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.plan-node .bar { fill: var(--pending); }
.plan-node .title { fill: var(--ink); font-size: 12px; font-weight: 650; }
.plan-node .sub { fill: var(--ink-3); font-size: 10px; letter-spacing: .05em; text-transform: uppercase; }
.plan-node.complete .bar, .plan-node.complete .sub { fill: var(--good); }
.plan-node.complete rect.box { stroke: color-mix(in srgb, var(--good) 45%, var(--border)); }
.plan-node.in-progress .bar, .plan-node.in-progress .sub { fill: var(--accent); }
.plan-node.in-progress rect.box { stroke: color-mix(in srgb, var(--accent) 55%, var(--border)); }
.plan-node.discarded .bar { fill: transparent; }
.plan-node.discarded .title { fill: var(--ink-3); text-decoration: line-through; }
.plan-node:hover rect.box { stroke: var(--accent); }
.plan-dep { fill: none; stroke: var(--ink-3); stroke-width: 1.3; opacity: .35; }
.plan-dep.cross { stroke: var(--ink-2); stroke-width: 2.2; opacity: .75; }
#plan-svg.hover .plan-node, #plan-svg.hover .plan-dep, #plan-svg.hover .plan-band { opacity: .18; }
#plan-svg.hover .plan-node.lit, #plan-svg.hover .plan-dep.lit { opacity: 1; }
#plan-svg.hover .plan-node.lit rect.box { stroke: var(--accent); }
#plan-svg.hover .plan-dep.lit { stroke: var(--accent); opacity: .9; }
.tooltip {
  position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 10px; border-radius: 6px;
  font-size: 12px; z-index: 20; display: none; white-space: nowrap; box-shadow: var(--shadow);
}
.tooltip b { display: block; }
@media (max-width: 800px) {
  header { flex-wrap: wrap; row-gap: 8px; }
  header .meta { display: none; }
  main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); max-height: 200px; }
  .tiles { display: none; }
  .timeline { grid-template-columns: 160px 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Box</h1>
  <span class="meta" id="generated"></span>
  <div class="tabs">
    <button data-view="board" class="active">Board</button>
    <button data-view="timeline">Timeline</button>
    <button data-view="plan">Plan</button>
    <button data-view="tests">Tests</button>
    <button data-view="benchmarks">Benchmarks</button>
  </div>
  <div class="tiles" id="tiles"></div>
  <a class="link" href="/inspector?http=http://localhost:27750" target="_blank" rel="noopener"
     title="Open the inspector connected to a local instance">Inspect local instance</a>
  <button class="icon-btn" id="theme" title="Toggle theme">◐</button>
</header>
<main>
  <aside>
    <h2>Epics</h2>
    <div id="epics"></div>
  </aside>
  <div class="content" id="content">
    <div id="board" class="board"></div>
    <div id="timeline" class="timeline" hidden></div>
    <div id="plan" class="plan" hidden></div>
    <div id="tests" class="page" hidden></div>
    <div id="benchmarks" class="page" hidden></div>
    <div class="panel" id="panel" hidden></div>
  </div>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
const state = {
  data: null, tests: null, bench: null, epic: null, view: "board", zoom: 6, item: null,
  suites: [], benchSuites: [], scenes: [], hidden: {}, planView: null, planFilter: { epic: "", open: false },
  testsUi: { sort: { key: "name", dir: 1 }, search: "", charts: false },
  benchUi: { sort: { key: "name", dir: 1 }, search: "", charts: false },
  scroll: { content: 0, aside: 0, panel: 0, tlx: 0, tly: 0, tests: 0, bench: 0, plan: 0 },
};
const VIEWS = ["board", "timeline", "plan", "tests", "benchmarks"];
const CONTENT_KEY = { board: "content", tests: "tests", benchmarks: "bench", plan: "plan" };
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];
const UI_KEY = "box-ui:" + location.pathname;
let saveTimer = 0, panelTimer = 0, searchTimer = 0, restoring = false;
const ICONS = {
  complete: '<svg viewBox="0 0 10 10"><path d="M1.5 5.5l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  "in progress": '<svg viewBox="0 0 10 10"><path d="M2 1.5v7l6-3.5z" fill="currentColor"/></svg>',
  pending: '<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
  discarded: '<svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
const cls = s => s.replace(" ", "-");
const inspectLink = item => item.inspect_url
  ? `<a class="link" href="${esc(item.inspect_url)}" target="_blank" rel="noopener"
       title="Open the inspector with the wasm image of this epic">Inspect</a>` : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
const dur = (a, b) => {
  if (!a) return "";
  const ms = (b ? new Date(b) : new Date()) - new Date(a);
  const h = ms / 36e5;
  if (h < 1) return Math.round(ms / 6e4) + "m";
  if (h < 48) return h.toFixed(1) + "h";
  return (h / 24).toFixed(1) + "d";
};

function saveUi() {
  try {
    localStorage.setItem(UI_KEY, JSON.stringify({
      view: state.view, epic: state.epic, item: state.item, zoom: state.zoom, scroll: state.scroll,
      suites: state.suites, benchSuites: state.benchSuites, scenes: state.scenes, hidden: state.hidden,
      testsUi: state.testsUi, benchUi: state.benchUi, planView: state.planView, planFilter: state.planFilter,
    }));
  } catch (e) {}
}

function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveUi, 200);
}

function loadUi() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(UI_KEY) || "null"); } catch (e) {}
  if (!saved) return;
  if (VIEWS.includes(saved.view)) state.view = saved.view;
  if (saved.epic) state.epic = saved.epic;
  if (saved.item) state.item = saved.item;
  if (Array.isArray(saved.suites)) state.suites = saved.suites;
  else if (saved.suite) state.suites = [saved.suite];
  if (Array.isArray(saved.benchSuites)) state.benchSuites = saved.benchSuites;
  if (saved.hidden && typeof saved.hidden === "object") state.hidden = saved.hidden;
  if (Array.isArray(saved.scenes)) state.scenes = saved.scenes;
  else if (saved.scene) state.scenes = ["scene:" + saved.scene];
  for (const key of ["testsUi", "benchUi"]) {
    const ui = saved[key];
    if (!ui || typeof ui !== "object") continue;
    if (typeof ui.search === "string") state[key].search = ui.search;
    state[key].charts = !!ui.charts;
    if (ui.sort && typeof ui.sort.key === "string") state[key].sort = { key: ui.sort.key, dir: ui.sort.dir < 0 ? -1 : 1 };
  }
  if (saved.zoom > 0) state.zoom = saved.zoom;
  if (saved.planView && saved.planView.k > 0) state.planView = saved.planView;
  if (saved.planFilter && typeof saved.planFilter === "object") {
    state.planFilter = { epic: String(saved.planFilter.epic || ""), open: !!saved.planFilter.open };
  }
  if (saved.scroll) Object.assign(state.scroll, saved.scroll);
}

function applyView() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
  for (const view of VIEWS) document.getElementById(view).hidden = state.view !== view;
}

function trackScroll(el, key) {
  el.onscroll = () => {
    if (restoring) return;
    state.scroll[typeof key === "function" ? key() : key] = el.scrollTop;
    saveSoon();
  };
}

function restoreScroll(el, top, left) {
  restoring = true;
  el.scrollTop = top;
  if (left != null) el.scrollLeft = left;
  requestAnimationFrame(() => { restoring = false; });
}

function chip(status) {
  return `<span class="chip ${cls(status)}">${ICONS[status] || ""}${esc(status)}</span>`;
}

const CASE_ICON = { pass: "complete", fail: "discarded", empty: "pending" };

function caseChip(status) {
  return `<span class="chip ${esc(status)}">${ICONS[CASE_ICON[status]] || ""}${esc(status)}</span>`;
}

function markdown(src) {
  const lines = src.split("\n");
  let html = "", inList = false, inCode = false;
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  for (const line of lines) {
    if (line.startsWith("```")) { inCode = !inCode; html += inCode ? "<pre>" : "</pre>"; continue; }
    if (inCode) { html += esc(line) + "\n"; continue; }
    const li = line.match(/^\s*[-*] (.*)/);
    if (li) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    const h = line.match(/^(#+) (.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function flatten(items, out = []) {
  for (const it of items) { out.push(it); flatten(it.children, out); }
  return out;
}

function counts(items) {
  const c = { complete: 0, "in progress": 0, pending: 0, discarded: 0, total: 0 };
  for (const it of items) { c[it.status] = (c[it.status] || 0) + 1; c.total++; }
  return c;
}

function findItem(path) {
  return flatten(state.data.epics).find(i => i.path === path);
}

function testSummary(item) {
  const t = item.deliverables.map(d => d.tests).filter(Boolean);
  if (!t.length) return "";
  const last = t[t.length - 1];
  return `<div class="tests" title="${esc(last.project)} · ${esc(last.timestamp)}">
    <span>${last.count} tests</span>
    <b class="ok">${last.pass} pass</b>
    ${last.fail ? `<b class="bad">${last.fail} fail</b>` : ""}
    ${last.empty ? `<b class="empty">${last.empty} empty</b>` : ""}
    <span>${(+last.elapsed).toFixed(1)}s</span></div>`;
}

function renderHeader() {
  const all = flatten(state.data.epics);
  const tasks = all.filter(i => i.level === "task");
  const subs = all.filter(i => i.level === "subtask");
  const ct = counts(tasks), cs = counts(subs);
  document.getElementById("tiles").innerHTML = `
    <div class="tile"><b>${state.data.epics.length}</b><span>epics</span></div>
    <div class="tile"><b>${ct.complete}<small style="color:var(--ink-3)">/${ct.total}</small></b><span>tasks done</span></div>
    <div class="tile"><b>${cs.complete}<small style="color:var(--ink-3)">/${cs.total}</small></b><span>subtasks done</span></div>
    <div class="tile"><b>${ct["in progress"] + cs["in progress"]}</b><span>active</span></div>`;
  document.getElementById("generated").textContent = "updated " + new Date(state.data.generated).toLocaleTimeString();
}

function renderEpics() {
  const el = document.getElementById("epics");
  el.innerHTML = state.data.epics.map(e => {
    const c = counts(flatten(e.children).filter(i => i.level === "task"));
    const pct = n => c.total ? (100 * n / c.total) + "%" : "0%";
    return `<button class="epic ${e.path === state.epic ? "active" : ""}" data-epic="${esc(e.path)}">
      <div class="name"><span class="dot ${cls(e.status)}"></span>${esc(e.readme.title || e.name)}</div>
      <div class="sub">${c.complete}/${c.total} tasks · ${esc(e.status)}</div>
      <div class="bar"><i class="done" style="width:${pct(c.complete)}"></i><i class="active" style="width:${pct(c["in progress"])}"></i></div>
    </button>`;
  }).join("") || `<div class="empty-state">No epics yet</div>`;
  el.querySelectorAll(".epic").forEach(b => b.onclick = () => { state.epic = b.dataset.epic; render(); });
  restoreScroll(document.querySelector("aside"), state.scroll.aside);
}

function renderBoard() {
  const board = document.getElementById("board");
  const epic = state.data.epics.find(e => e.path === state.epic);
  if (!epic) { board.innerHTML = `<div class="empty-state">Select an epic</div>`; return; }
  const cards = epic.children.map(t => `
    <div class="card ${cls(t.status)}">
      <div class="card-head">
        <h3 data-item="${esc(t.path)}">${esc(t.readme.title || t.name)}</h3>
        ${chip(t.status)}
      </div>
      <div class="kind">${esc(t.kind)} · ${esc(t.name)}${t.start_time ? " · " + dur(t.start_time, t.end_time) : ""}</div>
      <div class="brief">${esc(t.readme.brief || "")}</div>
      ${t.dependencies.length ? `<div class="deps">after ${t.dependencies.map(d => `<code>${esc(d)}</code>`).join(", ")}</div>` : ""}
      ${testSummary(t)}
      ${t.children.length ? `<ul class="subtasks">${t.children.map(s => `
        <li class="${cls(s.status)}" data-item="${esc(s.path)}">
          <span class="dot ${cls(s.status)}"></span><span class="t">${esc(s.readme.title || s.name)}</span>
          <time>${s.start_time ? dur(s.start_time, s.end_time) : ""}</time>
        </li>`).join("")}</ul>` : ""}
    </div>`);
  const epicCard = `
    <div class="card" style="grid-column: 1 / -1">
      <div class="card-head"><h3 data-item="${esc(epic.path)}">${esc(epic.readme.title || epic.name)}</h3>${inspectLink(epic)}${chip(epic.status)}</div>
      <div class="brief">${esc(epic.readme.brief || "")}</div>
      ${testSummary(epic)}
    </div>`;
  board.innerHTML = epicCard + (cards.join("") || `<div class="empty-state">No tasks yet</div>`);
  board.querySelectorAll("[data-item]").forEach(el => el.onclick = () => openPanel(el.dataset.item));
  restoreScroll(document.getElementById("content"), state.scroll.content);
}

function closePanel() {
  const panel = document.getElementById("panel");
  panel.classList.remove("open");
  clearTimeout(panelTimer);
  panelTimer = setTimeout(() => { if (!panel.classList.contains("open")) panel.hidden = true; }, 220);
}

function openPanel(path) {
  if (path !== state.item) state.scroll.panel = 0;
  state.item = path;
  const item = findItem(path);
  const panel = document.getElementById("panel");
  if (!item) { closePanel(); return; }
  const deliverables = item.deliverables.map(d => {
    const img = /\.(png|jpe?g|gif|webp|svg)$/i.test(d.name);
    const t = d.tests;
    if (/\.html$/i.test(d.name)) {
      const build = item.inspect_url || d.url;
      return `<li><span class="n">${esc(d.name)}</span><a class="chip in-progress" href="${esc(build)}" target="_blank" rel="noopener">${ICONS["in progress"]}${item.inspect_url ? "open in inspector" : "open build"}</a></li>`;
    }
    return `<li><span class="n"><a href="${esc(d.url)}" target="_blank">${esc(d.name)}</a></span>
      ${t ? `<span class="tests"><b class="ok">${t.pass}</b>${t.fail ? `<b class="bad">${t.fail}</b>` : ""}${t.empty ? `<b class="empty">${t.empty}</b>` : ""}</span>` : `<span style="color:var(--ink-3);font-size:11px">${(d.size / 1024).toFixed(1)} KB</span>`}
      </li>${img ? `<li style="display:block;border:0;padding:0"><img src="${esc(d.url)}" alt="${esc(d.name)}"></li>` : ""}`;
  }).join("");
  panel.innerHTML = `
    <button class="close icon-btn" id="close">✕</button>
    <div class="path">${esc(item.level)} · ${esc(item.path)}</div>
    <h1>${esc(item.readme.title || item.name)}</h1>
    <div class="meta">${chip(item.status)}<span class="kind">${esc(item.kind)}</span>
      <span style="color:var(--ink-3);font-size:12px">${item.start_time ? fmtDate(item.start_time) + " → " + (item.end_time ? fmtDate(item.end_time) : "now") + " (" + dur(item.start_time, item.end_time) + ")" : "not started"}</span>
      ${item.level === "epic" ? `<label class="prio" title="Lower runs first, 100 by default">priority
        <input type="number" id="epic-priority" step="10" value="${esc(item.priority)}"></label>
        <span class="plan-note" id="prio-note"></span>` : ""}
      ${inspectLink(item)}</div>
    ${item.dependencies.length ? `<div class="deps">Depends on ${item.dependencies.map(d => `<code>${esc(d)}</code>`).join(", ")}</div>` : ""}
    <div class="md">${markdown(item.readme.markdown)}</div>
    ${deliverables ? `<h2>Deliverables</h2><ul class="deliverables">${deliverables}</ul>` : ""}
    ${item.children.length ? `<h2>${item.children[0].level}s</h2><ul class="subtasks">${item.children.map(s => `
      <li class="${cls(s.status)}" data-item="${esc(s.path)}"><span class="dot ${cls(s.status)}"></span><span class="t">${esc(s.readme.title || s.name)}</span><time>${s.start_time ? dur(s.start_time, s.end_time) : ""}</time></li>`).join("")}</ul>` : ""}`;
  clearTimeout(panelTimer);
  if (panel.hidden) { panel.hidden = false; void panel.offsetWidth; }
  panel.classList.add("open");
  restoreScroll(panel, state.scroll.panel);
  saveSoon();
  document.getElementById("close").onclick = () => { state.item = null; state.scroll.panel = 0; closePanel(); saveUi(); };
  panel.querySelectorAll("[data-item]").forEach(el => el.onclick = () => openPanel(el.dataset.item));
  const priority = document.getElementById("epic-priority");
  if (priority) priority.onchange = () => savePriority(item.name, priority.value);
  const readme = item.deliverables.find(d => /readme\.md$/i.test(d.name));
  if (readme) fetch(readme.url).then(r => r.text()).then(t => {
    const div = document.createElement("div");
    div.className = "readme-deliverable md";
    div.innerHTML = `<h2>Completion report</h2>` + markdown(t);
    panel.querySelector(".deliverables")?.after(div);
  });
}

function renderTimeline() {
  const tl = document.getElementById("timeline");
  const rows = [];
  for (const e of state.data.epics) {
    rows.push({ item: e, kind: "epic-row" });
    for (const t of e.children) {
      rows.push({ item: t, kind: "task-row" });
      for (const s of t.children) rows.push({ item: s, kind: "sub-row" });
    }
  }
  const now = Date.now();
  const times = flatten(state.data.epics).flatMap(i => [i.start_time, i.end_time]).filter(Boolean).map(t => +new Date(t));
  const t0 = new Date(Math.min(now, ...times)); t0.setHours(0, 0, 0, 0);
  const t1 = new Date(Math.max(now, ...times) + 36e5 * 12);
  const pxPerHour = state.zoom;
  const x = t => (t - t0) / 36e5 * pxPerHour;
  const width = Math.max(x(t1), 800);
  const days = [];
  for (let d = new Date(t0); d < t1; d.setDate(d.getDate() + 1)) days.push(new Date(d));
  const bar = it => {
    if (!it.start_time) return "";
    const s = +new Date(it.start_time), e = it.end_time ? +new Date(it.end_time) : now;
    return `<div class="tl-bar ${cls(it.status)} ${it.level === "epic" ? "epic-bar" : ""}" data-item="${esc(it.path)}" style="left:${x(s)}px;width:${Math.max(3, x(e) - x(s))}px"></div>`;
  };
  tl.innerHTML = `
    <div class="tl-labels"><div style="height:40px;border-bottom:1px solid var(--border)"></div><div id="tl-label-rows">
      ${rows.map(r => `<div class="tl-row ${r.kind}"><span class="dot ${cls(r.item.status)}"></span><span class="lbl" data-item="${esc(r.item.path)}">${esc(r.item.readme.title || r.item.name)}</span></div>`).join("")}
    </div></div>
    <div class="tl-tools"><button id="zoom-out">−</button><button id="zoom-in">+</button><button id="zoom-now">now</button></div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl-head" style="width:${width}px">${days.map(d => `<div class="day" style="left:${x(d)}px">${d.toLocaleDateString([], { weekday: "short" })}<small>${d.toLocaleDateString([], { month: "short", day: "numeric" })}</small></div>`).join("")}</div>
      <div class="tl-body" style="width:${width}px">
        ${days.map(d => `<div class="tl-vline" style="left:${x(d)}px"></div>`).join("")}
        <div class="tl-now" style="left:${x(now)}px"></div>
        ${rows.map(r => `<div class="tl-grid-row ${r.kind}">${bar(r.item)}</div>`).join("")}
      </div>
    </div>`;
  const scroll = document.getElementById("tl-scroll");
  const labels = document.getElementById("tl-label-rows");
  scroll.onscroll = () => {
    labels.style.transform = `translateY(${-scroll.scrollTop}px)`;
    if (restoring) return;
    state.scroll.tlx = scroll.scrollLeft;
    state.scroll.tly = scroll.scrollTop;
    saveSoon();
  };
  const rezoom = z => {
    state.scroll.tlx *= z / state.zoom;
    state.zoom = z;
    renderTimeline();
    saveUi();
  };
  document.getElementById("zoom-in").onclick = () => rezoom(Math.min(120, state.zoom * 1.5));
  document.getElementById("zoom-out").onclick = () => rezoom(Math.max(1, state.zoom / 1.5));
  document.getElementById("zoom-now").onclick = () => { scroll.scrollLeft = x(now) - scroll.clientWidth * .7; };
  if (state.scroll.tlx || state.scroll.tly) restoreScroll(scroll, state.scroll.tly, state.scroll.tlx);
  else scroll.scrollLeft = Math.max(0, x(now) - scroll.clientWidth * .7);
  labels.style.transform = `translateY(${-scroll.scrollTop}px)`;
  const tip = document.getElementById("tooltip");
  tl.querySelectorAll("[data-item]").forEach(el => {
    el.onclick = () => openPanel(el.dataset.item);
    if (!el.classList.contains("tl-bar")) return;
    el.onmousemove = ev => {
      const it = findItem(el.dataset.item);
      tip.style.display = "block"; tip.style.left = ev.clientX + 12 + "px"; tip.style.top = ev.clientY + 12 + "px";
      tip.innerHTML = `<b>${esc(it.readme.title || it.name)}</b>${esc(it.status)} · ${fmtDate(it.start_time)} → ${it.end_time ? fmtDate(it.end_time) : "now"} · ${dur(it.start_time, it.end_time)}`;
    };
    el.onmouseleave = () => tip.style.display = "none";
  });
}

function niceTicks(max, count) {
  if (!(max > 0)) return [0, 1];
  const raw = max / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm > 5 ? 10 : norm > 2 ? 5 : norm > 1 ? 2 : 1) * mag;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let i = 0; i * step <= top + step * 1e-9; i++) ticks.push(+(i * step).toPrecision(12));
  return ticks;
}

function chartWidth(el) {
  return Math.max(320, (el.clientWidth || 900) - 74);
}

function seriesDash(i) {
  return i >= SERIES.length * 2 ? "2 3" : i >= SERIES.length ? "6 4" : null;
}

function nsUnit(max) {
  if (max >= 1e9) return { div: 1e9, unit: "s" };
  if (max >= 1e6) return { div: 1e6, unit: "ms" };
  if (max >= 1e3) return { div: 1e3, unit: "µs" };
  return { div: 1, unit: "ns" };
}

function nsText(v) {
  if (v == null) return "—";
  const u = nsUnit(Math.abs(v));
  return +(v / u.div).toPrecision(4) + " " + u.unit;
}

function lineChart(spec) {
  const all = (spec.series || []).filter(s => s.points.length);
  if (!all.length) return `<div class="chart"><div class="empty-state">No data points</div></div>`;
  const shown = all.filter(s => !s.hidden);
  const scale = shown.length ? shown : all;
  const w = spec.width, h = spec.height || 210;
  const pad = { l: 56, r: 18, t: 22, b: 40 };
  const iw = Math.max(120, w - pad.l - pad.r), ih = Math.max(70, h - pad.t - pad.b);
  const ts = scale.flatMap(s => s.points.map(p => p.t));
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 - t0 < 6e5) { t0 -= 9e5; t1 += 9e5; }
  const values = scale.flatMap(s => s.points.map(p => p.v).concat((s.band || []).map(b => b.hi)));
  const ticks = niceTicks(Math.max(...values, 0), 4);
  const top = ticks[ticks.length - 1] || 1;
  const X = t => +(pad.l + (t - t0) / (t1 - t0) * iw).toFixed(1);
  const Y = v => +(pad.t + ih - Math.max(0, Math.min(v, top)) / top * ih).toFixed(1);
  const fmt = spec.yFormat || (v => String(+v.toPrecision(3)));
  const grid = ticks.map(v => `<line class="grid" x1="${pad.l}" y1="${Y(v)}" x2="${pad.l + iw}" y2="${Y(v)}"/>
    <text class="ax" x="${pad.l - 8}" y="${Y(v) + 3.5}" text-anchor="end">${esc(fmt(v))}</text>`).join("");
  let lastDay = "";
  const xAxis = [0, 1, 2, 3, 4].map(i => {
    const t = t0 + (t1 - t0) * i / 4, d = new Date(t);
    const day = d.toLocaleDateString([], { month: "short", day: "numeric" });
    const show = day !== lastDay;
    const anchor = i === 0 ? "start" : i === 4 ? "end" : "middle";
    lastDay = day;
    return `<text class="ax" x="${X(t)}" y="${pad.t + ih + 15}" text-anchor="${anchor}">${esc(d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }))}${show ? `<tspan x="${X(t)}" dy="12">${esc(day)}</tspan>` : ""}</text>`;
  }).join("");
  const bands = shown.map(s => {
    const band = s.band || [];
    if (!band.length) return "";
    if (band.length === 1) {
      return `<line x1="${X(band[0].t)}" y1="${Y(band[0].hi)}" x2="${X(band[0].t)}" y2="${Y(band[0].lo)}"
        stroke="${s.color}" stroke-width="8" stroke-linecap="round" opacity=".22"/>`;
    }
    const up = band.map(b => `${X(b.t)},${Y(b.hi)}`).join(" ");
    const down = band.slice().reverse().map(b => `${X(b.t)},${Y(b.lo)}`).join(" ");
    return `<polygon points="${up} ${down}" fill="${s.color}" opacity=".16"/>`;
  }).join("");
  const marks = shown.map(s => {
    const pts = s.points.map(p => `${X(p.t)},${Y(p.v)}`).join(" ");
    const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : "";
    const line = s.points.length > 1
      ? `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${dash} points="${pts}"/>` : "";
    return line + s.points.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.5" fill="var(--surface)" stroke="${s.color}" stroke-width="2"/>`).join("");
  }).join("");
  const hits = shown.flatMap(s => s.points.map(p =>
    `<circle class="hit" cx="${X(p.t)}" cy="${Y(p.v)}" r="9" data-tip="${esc(p.tip)}" data-sub="${esc(p.sub || "")}"/>`)).join("");
  const items = spec.legend || (all.length > 1 ? all : []);
  const legend = items.length ? `<div class="legend">${items.map(s => {
    const swatch = `<svg width="18" height="8" aria-hidden="true"><line x1="1" y1="4" x2="17" y2="4" stroke="${s.color}" stroke-width="2"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/></svg>${esc(s.name)}`;
    return s.key
      ? `<button class="${s.hidden ? "off" : ""}" data-series="${esc(s.key)}" title="Show or hide this line">${swatch}</button>`
      : `<span>${swatch}</span>`;
  }).join("")}</div>` : "";
  return `<div class="chart">${legend}
    <svg width="${w}" height="${h}" role="img" aria-label="${esc(spec.label || "time series")}">
      ${grid}<line class="grid" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t + ih}"/>
      <text class="ax-title" x="${pad.l}" y="${pad.t - 10}">${esc(spec.yLabel || "")}</text>
      ${xAxis}${bands}${marks}${hits}
    </svg></div>`;
}

function sparkline(points, color, tip, sub) {
  if (!points.length) return `<span class="muted">—</span>`;
  const w = 84, h = 22, pad = 3;
  const ts = points.map(p => p.t), vs = points.map(p => p.v);
  const t0 = Math.min(...ts), t1 = Math.max(...ts), top = Math.max(...vs, 0) || 1;
  const X = t => +(t1 === t0 ? w / 2 : pad + (t - t0) / (t1 - t0) * (w - 2 * pad)).toFixed(1);
  const Y = v => +(h - pad - Math.max(0, v) / top * (h - 2 * pad)).toFixed(1);
  const last = points[points.length - 1];
  const line = points.length > 1
    ? `<polyline fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" points="${points.map(p => `${X(p.t)},${Y(p.v)}`).join(" ")}"/>` : "";
  return `<svg class="spark" width="${w}" height="${h}" data-tip="${esc(tip)}" data-sub="${esc(sub || "")}"
    role="img" aria-label="${esc(tip)}">${line}<circle cx="${X(last.t)}" cy="${Y(last.v)}" r="2.5" fill="${color}"/></svg>`;
}

function bindTips(host) {
  const tip = document.getElementById("tooltip");
  host.querySelectorAll("[data-tip]").forEach(el => {
    el.onmousemove = ev => {
      tip.style.display = "block";
      tip.style.left = Math.min(ev.clientX + 12, innerWidth - 260) + "px";
      tip.style.top = ev.clientY + 12 + "px";
      const b = document.createElement("b");
      b.textContent = el.dataset.tip;
      tip.replaceChildren(b, document.createTextNode(el.dataset.sub || ""));
    };
    el.onmouseleave = () => { tip.style.display = "none"; };
  });
}

// --- tree logic (extracted by test_pm.py, keep free of DOM access) ---
const TREE_MAX_ROWS = 1200;
const TREE_SERIES = 12;
const TREE_RANK = { fail: 3, empty: 2, pass: 1 };
const TREE_COLS = {
  tests: [
    { key: "name", label: "Name", cls: "name" },
    { key: "cases", label: "Cases", cls: "num c-mid" },
    { key: "status", label: "Status", cls: "status" },
    { key: "time", label: "Time (s)", cls: "num" },
    { key: "trend", label: "Trend", cls: "trend c-mid" },
    { key: "latest", label: "Latest report", cls: "muted c-wide" },
  ],
  bench: [
    { key: "name", label: "Name", cls: "name" },
    { key: "cases", label: "Cases", cls: "num c-mid" },
    { key: "median", label: "Median", cls: "num" },
    { key: "mean", label: "Mean", cls: "num c-mid" },
    { key: "ci", label: "ci95", cls: "num muted c-wide" },
    { key: "p99", label: "p99", cls: "num c-wide" },
    { key: "iterations", label: "Iters", cls: "num c-wide" },
    { key: "samples", label: "Samples", cls: "num c-wide" },
    { key: "outliers", label: "Outliers", cls: "num c-wide" },
    { key: "trend", label: "Trend", cls: "trend c-mid" },
  ],
  scenes: [
    { key: "name", label: "Scene", cls: "name" },
    { key: "entities", label: "Entities", cls: "num c-mid" },
    { key: "drawn", label: "Drawn", cls: "num c-wide" },
    { key: "culled", label: "Culled", cls: "num c-wide" },
    { key: "mean_ms", label: "Mean (ms)", cls: "num" },
    { key: "p99", label: "p99 (ms)", cls: "num" },
    { key: "fps", label: "FPS", cls: "num c-mid" },
    { key: "trend", label: "Trend", cls: "trend c-mid" },
  ],
};

function trendPoints(rows, field) {
  return (rows || []).filter(r => r && r[field] != null).map(r => ({ t: +new Date(r.time), v: +r[field] }));
}

function countText(value) {
  const n = +value;
  if (!isFinite(n)) return "";
  if (n >= 1e6) return +(n / 1e6).toFixed(1) + "M";
  if (n >= 1e4) return Math.round(n / 1e3) + "k";
  return String(n);
}

function testTreeNodes(d) {
  const hist = d.suite_history || {}, cases = d.case_history || {};
  const bySuite = {};
  for (const s of d.suites || []) (bySuite[s.project] = bySuite[s.project] || []).push(s);
  return (d.projects || []).map((p, i) => ({
    key: "p:" + p.project, name: p.project, level: "project", color: SERIES[i % SERIES.length],
    note: p.suites + (p.suites === 1 ? " suite" : " suites"),
    cases: p.cases, pass: p.pass, fail: p.fail, empty: p.empty, time: p.time, status: p.status,
    latest: p.latest, item: p.item, url: p.url, reports: p.reports,
    trend: trendPoints(p.trend, "elapsed"), detail: true,
    children: (bySuite[p.project] || []).map((s, j) => ({
      key: s.key, name: s.suite, level: "suite", color: SERIES[j % SERIES.length],
      cases: s.cases, pass: s.pass, fail: s.fail, empty: s.empty, time: s.time, status: s.status,
      latest: s.report_time, item: s.item, url: s.url, file: s.file, reports: s.reports,
      trend: trendPoints(s.trend && s.trend.length ? s.trend : hist[s.key], "elapsed"), detail: true,
      children: (s.cases_detail || []).map(c => ({
        key: s.key + "|" + c.case, name: c.case, level: "case", status: c.status, time: c.time,
        color: c.status === "fail" ? "var(--bad)" : c.status === "empty" ? "var(--warn)" : "var(--good)",
        trend: trendPoints(cases[s.key + "|" + c.case], "elapsed"), children: [],
      })),
    })),
  }));
}

function benchTreeNodes(d) {
  const hist = d.micro_suite_history || {}, cases = d.micro_case_history || {};
  const bySuite = {};
  for (const s of d.micro_suites || []) (bySuite[s.project] = bySuite[s.project] || []).push(s);
  return (d.micro_projects || []).map((p, i) => ({
    key: "p:" + p.project, name: p.project, level: "project", color: SERIES[i % SERIES.length],
    note: p.suites + (p.suites === 1 ? " suite" : " suites"),
    cases: p.cases, median_ns: p.median_ns, mean_ns: p.mean_ns, reports: p.reports,
    latest: p.latest || p.time, item: p.item, url: p.url,
    trend: trendPoints(p.trend, "median_ns"), detail: true,
    children: (bySuite[p.project] || []).map((s, j) => ({
      key: s.key, name: s.suite, level: "suite", color: SERIES[j % SERIES.length],
      cases: s.cases, median_ns: s.median_ns, mean_ns: s.mean_ns, reports: s.reports,
      latest: s.time, item: s.item, url: s.url, file: s.file,
      trend: trendPoints(s.trend && s.trend.length ? s.trend : hist[s.key], "median_ns"), detail: true,
      children: (s.cases_detail || []).map(c => ({
        key: s.key + "|" + c.case, name: c.case, level: "case", color: SERIES[j % SERIES.length],
        median_ns: c.median_ns, mean_ns: c.mean_ns, stddev_ns: c.stddev_ns, p95_ns: c.p95_ns, p99_ns: c.p99_ns,
        ci_low_ns: c.ci_low_ns, ci_high_ns: c.ci_high_ns, iterations: c.iterations, samples: c.samples,
        outliers: c.outliers, trend: trendPoints(cases[s.key + "|" + c.case], "median_ns"), children: [],
      })),
    })),
  }));
}

function sceneTreeNodes(d) {
  const runs = d.runs || [];
  return (d.scenes || []).map((s, i) => {
    const own = runs.filter(r => r.scene === s.scene);
    return {
      key: "scene:" + s.scene, name: s.scene, level: "scene", color: SERIES[i % SERIES.length],
      entities: s.entities, drawn: s.drawn, culled: s.culled, frames: s.frames, fps: s.fps,
      mean_ms: s.mean_ms, p50_ms: s.p50_ms, p99_ms: s.p99_ms, max_ms: s.max_ms,
      latest: s.time, item: s.item, url: s.url, file: s.file, source: s.source, runs: own,
      note: own.length + (own.length === 1 ? " run" : " runs"),
      trend: trendPoints(own, "mean_ms"), detail: true, children: [],
    };
  });
}

function treeValue(node, key) {
  const trend = node.trend || [];
  switch (key) {
    case "name": return String(node.name || "").toLowerCase();
    case "status": return node.status ? TREE_RANK[node.status] || 0 : node.fail ? 3 : node.pass ? 1 : null;
    case "trend": return trend.length ? trend[trend.length - 1].v : null;
    case "latest": return node.latest ? +new Date(node.latest) : null;
    case "median": return node.median_ns;
    case "mean": return node.mean_ns;
    case "ci": return node.ci_low_ns == null ? null : node.ci_high_ns - node.ci_low_ns;
    case "p99": return node.p99_ns == null ? node.p99_ms : node.p99_ns;
    default: return node[key];
  }
}

function treeCompare(a, b, key, dir) {
  const av = treeValue(a, key), bv = treeValue(b, key);
  const an = av == null || av !== av, bn = bv == null || bv !== bv;
  if (an || bn) return an && bn ? 0 : an ? 1 : -1;
  if (av < bv) return -dir;
  if (av > bv) return dir;
  return String(a.name).localeCompare(String(b.name));
}

function treeSort(nodes, sort) {
  const key = (sort && sort.key) || "name";
  const dir = sort && sort.dir < 0 ? -1 : 1;
  return (nodes || []).slice().sort((a, b) => treeCompare(a, b, key, dir))
    .map(node => ({ ...node, children: treeSort(node.children, sort) }));
}

function treeFilter(nodes, query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return nodes || [];
  const keep = list => (list || []).map(node => {
    if (String(node.name || "").toLowerCase().includes(q)) return node;
    const children = keep(node.children);
    return children.length ? { ...node, children } : null;
  }).filter(Boolean);
  return keep(nodes);
}

function treeCount(nodes) {
  return (nodes || []).reduce((total, node) => total + 1 + treeCount(node.children), 0);
}

function treeKeys(nodes, out = []) {
  for (const node of nodes || []) {
    if ((node.children || []).length || node.detail) out.push(node.key);
    treeKeys(node.children, out);
  }
  return out;
}

function treeRows(nodes, open, force) {
  const rows = [];
  const walk = (list, depth) => {
    for (const node of list || []) {
      const children = node.children || [];
      const holds = children.length || node.detail;
      const isOpen = !!holds && (force || (open || []).includes(node.key));
      rows.push({ node, depth, open: isOpen, leaf: !holds });
      if (isOpen) walk(children, depth + 1);
    }
  };
  walk(nodes, 0);
  return rows;
}

function treeName(row) {
  const node = row.node;
  const dot = node.color ? `<span class="dot" style="background:${node.color}"></span>` : "";
  const note = node.note ? `<span class="muted nt">${esc(node.note)}</span>` : "";
  return `<span class="tw">${row.leaf ? "" : row.open ? "▾" : "▸"}</span>${dot}<span class="nm">${esc(node.name)}</span>${note}`;
}

function treeSpark(node, format) {
  const points = node.trend || [];
  if (!points.length) return `<span class="muted">—</span>`;
  return sparkline(points, node.color || "var(--accent)",
    node.name + " · " + points.length + " report(s)", points.slice(-6).map(format).join(" → "));
}

function ciText(node) {
  if (node.ci_low_ns == null || node.ci_high_ns == null) return "";
  const half = (node.ci_high_ns - node.ci_low_ns) / 2;
  const span = esc(nsText(node.ci_low_ns) + " – " + nsText(node.ci_high_ns));
  return `<span title="${span}">±${node.median_ns ? (100 * half / node.median_ns).toFixed(2) + "%" : esc(nsText(half))}</span>`;
}

function testChips(node) {
  return `<span class="chip pass">${node.pass} pass</span>`
    + (node.fail ? `<span class="chip fail">${node.fail} fail</span>` : "")
    + (node.empty ? `<span class="chip empty">${node.empty} empty</span>` : "");
}

function testCell(row, col) {
  const n = row.node;
  switch (col.key) {
    case "name": return treeName(row);
    case "cases": return n.cases == null ? "" : String(n.cases);
    case "status": return n.level === "case" ? caseChip(n.status) : testChips(n);
    case "time": return n.time == null ? "" : (+n.time).toFixed(n.level === "case" ? 4 : 3);
    case "trend": return treeSpark(n, p => (+p.v).toFixed(3) + "s");
    case "latest": return n.latest ? esc((n.item || "db") + " · " + fmtDate(n.latest)) : "";
  }
  return "";
}

function benchCell(row, col) {
  const n = row.node;
  switch (col.key) {
    case "name": return treeName(row);
    case "cases": return n.cases == null ? "" : String(n.cases);
    case "median": return n.median_ns == null ? "" : esc(nsText(n.median_ns));
    case "mean": return n.mean_ns == null ? "" : esc(nsText(n.mean_ns));
    case "ci": return ciText(n);
    case "p99": return n.p99_ns == null ? "" : esc(nsText(n.p99_ns));
    case "iterations": return n.iterations == null ? "" : esc(countText(n.iterations));
    case "samples": return n.samples == null ? "" : String(n.samples);
    case "outliers": return n.outliers == null ? "" : `<span class="${n.outliers ? "empty" : ""}">${n.outliers}</span>`;
    case "trend": return treeSpark(n, p => nsText(p.v));
  }
  return "";
}

function sceneCell(row, col) {
  const n = row.node;
  const num = (v, digits) => v == null ? "—" : (+v).toFixed(digits);
  switch (col.key) {
    case "name": return treeName(row);
    case "entities": return n.entities == null ? "—" : esc(countText(n.entities));
    case "drawn": return n.drawn == null ? "—" : esc(countText(n.drawn));
    case "culled": return n.culled == null ? "—" : esc(countText(n.culled));
    case "mean_ms": return num(n.mean_ms, 3);
    case "p99": return num(n.p99_ms, 3);
    case "fps": return num(n.fps, 0);
    case "trend": return treeSpark(n, p => (+p.v).toFixed(2) + "ms");
  }
  return "";
}

const TREE_CELLS = { tests: testCell, bench: benchCell, scenes: sceneCell };

function treeMeta(row) {
  const n = row.node;
  const bits = [];
  if (n.ci_low_ns != null) bits.push("ci95 " + nsText(n.ci_low_ns) + " – " + nsText(n.ci_high_ns));
  if (n.stddev_ns != null) bits.push("stddev " + nsText(n.stddev_ns));
  if (n.p99_ns != null) bits.push("p99 " + nsText(n.p99_ns));
  if (n.iterations != null) bits.push(countText(n.iterations) + " iterations");
  if (n.samples != null) bits.push(n.samples + " samples");
  if (n.outliers != null) bits.push(n.outliers + " outliers");
  if (n.entities != null) bits.push(countText(n.entities) + " entities");
  if (n.drawn != null) bits.push(countText(n.drawn) + " drawn · " + countText(n.culled) + " culled");
  if (n.fps != null) bits.push((+n.fps).toFixed(0) + " fps");
  if (n.latest) bits.push((n.item || "db") + " · " + fmtDate(n.latest));
  return bits.length ? esc(bits.join(" · ")) : "";
}

function treeRowHtml(row, cols, cell) {
  const n = row.node;
  const cells = cols.map(col => `<div class="cell ${col.cls}">${cell(row, col)}</div>`).join("");
  const meta = treeMeta(row);
  return `<div class="trow lvl-${esc(n.level)}${row.open ? " open" : ""}" style="--depth:${row.depth}"
    data-row="${esc(n.key)}"${row.leaf ? "" : ` data-toggle="1"`}>${cells}${meta ? `<div class="cell meta">${meta}</div>` : ""}</div>`;
}

function treeHead(cols, sort) {
  const key = (sort && sort.key) || "name";
  const dir = sort && sort.dir < 0 ? " ↓" : " ↑";
  return `<div class="trow thead">${cols.map(col =>
    `<button type="button" class="cell ${col.cls}${key === col.key ? " sorted" : ""}" data-sort="${esc(col.key)}"
      title="Sort by ${esc(col.label)}">${esc(col.label)}${key === col.key ? dir : ""}</button>`).join("")}</div>`;
}

function treeHtml(id, rows, sort, detail) {
  const cols = TREE_COLS[id], cell = TREE_CELLS[id];
  const shown = rows.slice(0, TREE_MAX_ROWS);
  const body = shown.map(row => treeRowHtml(row, cols, cell)
    + (row.open && detail ? treeDetailHtml(row, detail) : "")).join("");
  const more = rows.length > shown.length
    ? `<div class="tree-note">showing the first ${shown.length} of ${rows.length} rows · narrow the filter</div>` : "";
  return `<div class="tree t-${esc(id)}">${treeHead(cols, sort)}${body
    || `<div class="tree-note">nothing matches the filter</div>`}${more}</div>`;
}

function treeDetailHtml(row, detail) {
  const html = detail(row);
  return html ? `<div class="tree-detail" style="--depth:${row.depth}">${html}</div>` : "";
}

function treeToolbar(id, ui, rows, total) {
  return `<div class="tools">
    <input type="search" data-search="${esc(id)}" value="${esc(ui.search)}"
      placeholder="Filter by project, suite or case" aria-label="Filter rows by name">
    <button type="button" data-expand="${esc(id)}">Expand all</button>
    <button type="button" data-collapse="${esc(id)}">Collapse all</button>
    <span class="muted">${rows} of ${total} rows</span>
  </div>`;
}

function statTiles(tiles) {
  return `<div class="stats">${tiles.map(t => `<div class="stat"><span>${esc(t.label)}</span>
    <b>${esc(t.value)}${t.note ? `<small> ${esc(t.note)}</small>` : ""}</b>
    ${(t.points || []).length ? sparkline(t.points, t.color || "var(--accent)", t.label, t.tip || "") : ""}</div>`).join("")}</div>`;
}
// --- end tree logic ---

function treeSearchCaret(id) {
  const active = document.activeElement;
  return active && active.getAttribute && active.getAttribute("data-search") === id ? active.selectionStart : null;
}

function bindTree(el, id, open, nodes, ui, rerender, caret) {
  el.querySelectorAll(".trow[data-toggle]").forEach(row => row.onclick = ev => {
    if (ev.target.closest("a")) return;
    const key = row.getAttribute("data-row");
    const i = open.indexOf(key);
    if (i < 0) open.push(key); else open.splice(i, 1);
    rerender();
    saveUi();
  });
  el.querySelectorAll("[data-sort]").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const key = btn.dataset.sort;
    ui.sort = { key, dir: ui.sort.key === key ? -ui.sort.dir : key === "name" ? 1 : -1 };
    rerender();
    saveUi();
  });
  el.querySelectorAll("[data-series]").forEach(btn => btn.onclick = ev => {
    ev.stopPropagation();
    const key = btn.dataset.series;
    if (state.hidden[key]) delete state.hidden[key]; else state.hidden[key] = true;
    rerender();
    saveUi();
  });
  const charts = el.querySelector(`[data-charts="${id}"]`);
  if (charts) charts.onclick = () => { ui.charts = !ui.charts; rerender(); saveUi(); };
  const expand = el.querySelector(`[data-expand="${id}"]`);
  if (expand) expand.onclick = () => { open.splice(0, open.length, ...treeKeys(nodes)); rerender(); saveUi(); };
  const collapse = el.querySelector(`[data-collapse="${id}"]`);
  if (collapse) collapse.onclick = () => { open.splice(0, open.length); rerender(); saveUi(); };
  const search = el.querySelector(`[data-search="${id}"]`);
  if (!search) return;
  search.oninput = () => {
    ui.search = search.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { rerender(); saveUi(); }, 160);
  };
  if (caret == null) return;
  search.focus();
  search.setSelectionRange(caret, caret);
}

function benchTrendChip(trend) {
  const list = trend || [];
  if (!list.length) return "";
  const last = list[list.length - 1];
  const prev = list.slice(0, -1).reverse().find(p => p.project === last.project);
  const name = esc(last.project || "latest report");
  if (!prev || !prev.median_ns) return `<span class="chip pending">${name}</span>`;
  const pct = 100 * (last.median_ns - prev.median_ns) / prev.median_ns;
  if (Math.abs(pct) < 0.5) return `<span class="chip pending">${name} steady</span>`;
  return `<span class="chip ${pct < 0 ? "pass" : "fail"}">${name} ${pct < 0 ? "" : "+"}${pct.toFixed(1)}%</span>`;
}

    return {
      key, name: suite.name + "." + c.name, color: SERIES[(offset + j) % SERIES.length], dash: seriesDash(j),
      hidden: !!state.hidden[key],
      points: history.map(h => ({
        t: +new Date(h.time), v: h.median_ns,
        tip: `${c.name} · ${nsText(h.median_ns)}`,
        sub: `${fmtDate(h.time)} · ${h.item || ""}${h.ci_low_ns == null ? "" : ` · ci95 ${nsText(h.ci_low_ns)} – ${nsText(h.ci_high_ns)}`}`,
      })),
      band: history.filter(h => h.ci_low_ns != null && h.ci_high_ns != null)

    const all = (n.children || []).slice().sort((a, b) => (b.median_ns || 0) - (a.median_ns || 0));

      series.push({
