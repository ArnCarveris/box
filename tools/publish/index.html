<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>
<link rel="icon" href="/flecs.png">
<style>
  :root { --bg: #0b0e13; --bg2: #10141b; --fg: #e7ecf2; --muted: #8b95a3; --green: #42b983; --green-soft: #a2d8b4; --border: #232935; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #canvas:focus { outline: none; }
  #overlay { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; text-align: center; background: radial-gradient(1200px 600px at 50% -10%, rgba(66,185,131,0.10), transparent 60%), linear-gradient(180deg, var(--bg2), var(--bg)); transition: opacity .5s ease; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .title { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1; background: linear-gradient(180deg, #ffffff, #b9c4d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #bar { width: min(260px, 60vw); height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
  #bar > div { width: 100%; height: 100%; background: linear-gradient(90deg, var(--green), var(--green-soft)); transform: scaleX(0); transform-origin: left center; transition: transform .18s linear; }
  #bar.hidden { visibility: hidden; }
  #message { font-size: 0.95rem; font-weight: 500; }
  #detail { font-size: 0.82rem; color: var(--muted); max-width: 30em; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="overlay">
  <div class="title">{{TITLE}}</div>
  <div id="bar"><div></div></div>
  <div id="message">Starting&hellip;</div>
  <div id="detail"></div>
</div>
<script>window.BOX_GAME = {{GAME}};</script>
<script src="../{{ENGINE_DIR}}/loader.js"></script>
</body>
</html>
