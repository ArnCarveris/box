<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>boxrun</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #050508; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
  canvas:focus { outline: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: #ddd; background: #050508;
    font: 14px/1.5 -apple-system, system-ui, sans-serif; text-align: center;
  }
  #overlay.hidden { display: none; }
  #overlay .detail { color: #888; font-size: 12px; max-width: 32em; }
</style>
</head>
<body>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<div id="overlay"><div id="message">Starting...</div><div class="detail" id="detail"></div></div>
{{{ SCRIPT }}}
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var overlay = document.getElementById('overlay');
  var message = document.getElementById('message');
  var detail = document.getElementById('detail');
  function fail(text, note) {
    overlay.classList.remove('hidden');
    message.textContent = text;
    detail.textContent = note || '';
  }
  if (!navigator.gpu) {
    fail('WebGPU is not available in this browser.', 'Use a recent Chrome, Edge or Safari.');
    return;
  }
  canvas.addEventListener('pointerdown', function () { canvas.focus(); });
  var args = location.hash ? decodeURIComponent(location.hash.slice(1)).split(' ') : [];
  // ?preload=<path> (repeatable) fetches a file of the server into the same path of the page's
  // file system before main runs, so a check can open a scene that is not embedded from etc
  var preload = new URLSearchParams(location.search).getAll('preload');
  var files = [];
  Promise.all(preload.map(function (path) {
    return fetch(path).then(function (response) {
      if (!response.ok) {
        throw new Error('Cannot fetch ' + path + ': ' + response.status);
      }
      return response.arrayBuffer();
    }).then(function (data) {
      files.push({ path: path, data: new Uint8Array(data) });
    });
  })).then(function () {
    return navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
  }).then(function (adapter) {
    if (!adapter) {
      throw new Error('No WebGPU adapter.');
    }
    var features = adapter.features.has('timestamp-query') ? ['timestamp-query'] : [];
    return adapter.requestDevice({
      requiredFeatures: features,
      requiredLimits: { maxTextureArrayLayers: adapter.limits.maxTextureArrayLayers }
    });
  }).then(function (device) {
    device.lost.then(function (info) {
      if (info.reason !== 'destroyed') {
        fail('The WebGPU device was lost.', info.message);
      }
    });
    var options = {
      canvas: canvas,
      preinitializedWebGPUDevice: device,
      arguments: args.filter(function (a) { return a.length; }),
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      preRun: [function (module) {
        // Not every emscripten version passes the module to preRun callbacks; the factory
        // assigns its exports (FS among them) to the options object either way
        var fs = (module && module.FS) || options.FS;
        files.forEach(function (file) {
          var dir = file.path.substring(0, file.path.lastIndexOf('/'));
          if (dir) {
            fs.mkdirTree(dir);
          }
          fs.writeFile(file.path, file.data);
        });
      }]
    };
    return {{{ EXPORT_NAME }}}(options);
  }).then(function (Module) {
    window.Module = Module;
    overlay.classList.add('hidden');
    canvas.focus();
  }).catch(function (err) {
    if (err === 'unwind' || (err && err.name === 'ExitStatus' && err.status === 0)) {
      overlay.classList.add('hidden');
      return;
    }
    fail('Failed to start.', String(err && err.message ? err.message : err));
    console.error(err);
  });
})();
</script>
</body>
</html>
